<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>幼小衔接知识乐园</title>
<style>
:root {
  --coral: #FF6B6B;
  --coral-light: #FF8E8E;
  --coral-pale: #FFF0F0;
  --teal: #4ECDC4;
  --teal-light: #6FE0DB;
  --teal-pale: #E8FAF8;
  --yellow: #FFE66D;
  --yellow-pale: #FFFBE6;
  --bg: #FFF9F5;
  --white: #FFFFFF;
  --text: #3D3D3D;
  --text-light: #888888;
  --radius: 20px;
  --radius-sm: 12px;
  --shadow: 0 4px 20px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.10);
  --font: 'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

canvas#confetti {
  position: fixed; top:0; left:0; width:100%; height:100%;
  pointer-events: none; z-index: 9999;
}

#app {
  max-width: 520px;
  margin: 0 auto;
  padding: 16px 16px 24px;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 20px;
}

header .greeting { font-size: 22px; font-weight: 600; }
header .greeting .name { color: var(--coral); }
header .star-badge {
  display: flex; align-items: center; gap: 6px;
  background: var(--yellow-pale);
  padding: 8px 16px; border-radius: 50px;
  font-size: 20px; font-weight: 600;
}
header .star-badge .star-icon {
  font-size: 26px;
  animation: starPulse 2s ease-in-out infinite;
}
@keyframes starPulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

.admin-btn {
  background: none; border: 2px dashed #ddd; color: #bbb;
  width: 36px; height: 36px; border-radius: 50%;
  font-size: 16px; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  transition: all 0.2s;
}
.admin-btn:hover { border-color: var(--text-light); color: var(--text-light); }

/* ---- Home Page ---- */
.home-grid {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  align-content: start;
}

.tts-tip {
  margin: 14px 4px 0;
  padding: 10px 14px;
  background: #fff4e0;
  border: 1px solid #ffd591;
  border-radius: 14px;
  color: #ad6800;
  font-size: 15px;
  text-align: center;
  line-height: 1.5;
}
.home-grid .module-card:last-child:nth-child(odd) {
  grid-column: 1 / -1;
}

.module-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 24px 16px;
  text-align: center;
  cursor: pointer;
  box-shadow: var(--shadow);
  transition: transform 0.2s, box-shadow 0.2s;
  border: 3px solid transparent;
}
.module-card:active { transform: scale(0.95); }
.module-card .emoji { font-size: 48px; margin-bottom: 8px; }
.module-card .label { font-size: 22px; font-weight: 600; }
.module-card .desc {
  font-size: 14px; color: var(--text-light); margin-top: 4px;
}

.card-characters { border-color: var(--coral); }
.card-characters .label { color: var(--coral); }
.card-pinyin { border-color: var(--teal); }
.card-pinyin .label { color: var(--teal); }
.card-counting { border-color: #A78BFA; }
.card-counting .label { color: #A78BFA; }
.card-math { border-color: #F59E0B; }
.card-math .label { color: #F59E0B; }
.card-pattern { border-color: #34D399; }
.card-pattern .label { color: #34D399; }
.card-classify { border-color: #F472B6; }
.card-classify .label { color: #F472B6; }
.card-memory { border-color: #60A5FA; }
.card-memory .label { color: #60A5FA; }

/* ---- Quiz Page ---- */
.quiz-container {
  flex: 1;
  display: flex; flex-direction: column; gap: 16px;
}

.quiz-header {
  display: flex; align-items: center; gap: 12px;
}
.back-btn {
  background: var(--white); border: none;
  width: 44px; height: 44px; border-radius: 50%;
  font-size: 22px; cursor: pointer;
  box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: center;
}
.quiz-title { font-size: 22px; font-weight: 600; }
.replay-btn {
  margin-left: auto;
  background: var(--white); border: none;
  width: 44px; height: 44px; border-radius: 50%;
  font-size: 22px; cursor: pointer;
  box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: center;
}

.progress-wrap {
  background: #eee; border-radius: 50px; height: 12px; overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 50px;
  background: linear-gradient(90deg, var(--teal), var(--coral));
  transition: width 0.4s ease;
}

.question-area {
  background: var(--white);
  border-radius: var(--radius);
  padding: 40px 20px;
  text-align: center;
  box-shadow: var(--shadow);
  min-height: 200px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px;
}

.question-label {
  font-size: 18px; color: var(--text-light);
}
.question-emoji {
  font-size: 72px; line-height: 1.2;
}
.question-text {
  font-size: 48px; font-weight: 700; color: var(--coral);
}

.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.option-btn {
  background: var(--white);
  border: 3px solid #eee;
  border-radius: var(--radius);
  padding: 20px 12px;
  font-size: 28px; font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: var(--shadow);
  font-family: var(--font);
  min-height: 80px;
  display: flex; align-items: center; justify-content: center;
}
.option-btn:active { transform: scale(0.95); }
.option-btn.correct {
  border-color: var(--teal);
  background: var(--teal-pale);
  animation: popIn 0.4s ease;
}
.option-btn.wrong {
  border-color: var(--coral);
  background: var(--coral-pale);
  animation: shake 0.5s ease;
}
.option-btn:disabled { pointer-events: none; opacity: 0.7; }

/* ---- Memory Game ---- */
.memory-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 8px;
}
.memory-card {
  aspect-ratio: 1;
  background: linear-gradient(135deg, var(--teal-light), var(--teal));
  border: none;
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  font-size: 36px;
  cursor: pointer;
  transition: transform 0.2s, background 0.3s;
  display: flex; align-items: center; justify-content: center;
  min-height: 90px;
}
.memory-card:active { transform: scale(0.95); }
.memory-card.flipped {
  background: var(--white);
  border: 3px solid var(--teal);
}
.memory-card.matched {
  background: var(--teal-pale);
  border-color: var(--teal);
  opacity: 0.8;
  cursor: default;
}
.memory-card .card-face {
  display: none;
}
.memory-card.flipped .card-face,
.memory-card.matched .card-face {
  display: block;
}
.memory-card .card-back {
  display: block;
  font-size: 28px;
  color: var(--white);
}
.memory-card.flipped .card-back,
.memory-card.matched .card-back {
  display: none;
}
.memory-info {
  text-align: center;
  font-size: 18px;
  color: var(--text-light);
  margin-bottom: 8px;
}
@keyframes popIn {
  0% { transform: scale(0.8); opacity: 0.5; }
  60% { transform: scale(1.08); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}
@keyframes starFly {
  0% { transform: scale(1) translateY(0); opacity: 1; }
  100% { transform: scale(0.5) translateY(-60px); opacity: 0; }
}

.feedback-overlay {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none; z-index: 100;
}
.feedback-text {
  font-size: 40px; font-weight: 700; opacity: 0;
  animation: feedbackPop 1.2s ease forwards;
  text-shadow: 0 2px 12px rgba(0,0,0,0.08);
}
@keyframes feedbackPop {
  0% { opacity:0; transform: translateY(20px) scale(0.5); }
  30% { opacity:1; transform: translateY(0) scale(1.1); }
  50% { transform: translateY(0) scale(1); }
  100% { opacity:0; transform: translateY(-30px) scale(0.8); }
}

/* === 反馈动画系统（新增）=== */
.fb-medal {
  position: fixed; left: 50%; top: 45%;
  width: 120px; height: 120px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 48px; z-index: 200; pointer-events: none;
  box-shadow: 0 8px 30px rgba(0,0,0,0.18);
  animation: medalPop 0.5s ease forwards;
}
@keyframes medalPop {
  0%   { transform: translate(-50%,-50%) scale(0); }
  60%  { transform: translate(-50%,-50%) scale(1.2); }
  100% { transform: translate(-50%,-50%) scale(1); }
}

.fb-bg-flash {
  position: fixed; inset: 0; background: #FFD700; opacity: 0.3;
  z-index: 150; pointer-events: none; animation: bgFlash 0.3s ease forwards;
}
@keyframes bgFlash {
  0%   { opacity: 0.3; }
  100% { opacity: 0; }
}

.fb-particle {
  position: fixed; z-index: 160; pointer-events: none;
  animation-name: particleFall; animation-timing-function: ease-in;
  animation-fill-mode: forwards; will-change: transform, opacity;
}
@keyframes particleFall {
  0%   { transform: translate(0,0) rotate(0deg); opacity: 1; }
  100% { transform: translate(var(--drift,0), 110vh) rotate(360deg); opacity: 0; }
}

.fb-combo {
  position: fixed; left: 50%; top: 62%; transform: translateX(-50%);
  font-size: 24px; font-weight: 700; z-index: 200; pointer-events: none;
  color: #FF6B6B; text-shadow: 0 2px 8px rgba(0,0,0,0.12);
  animation: comboSlide 1.5s ease forwards;
}
@keyframes comboSlide {
  0%   { opacity: 0; transform: translateX(-50%) translateY(30px); }
  20%  { opacity: 1; transform: translateX(-50%) translateY(0); }
  80%  { opacity: 1; }
  100% { opacity: 0; }
}

.fb-wrong {
  position: fixed; left: 50%; top: 45%; transform: translate(-50%,-50%);
  z-index: 200; pointer-events: none; display: flex; flex-direction: column;
  align-items: center; gap: 12px; animation: wrongPop 2s ease forwards;
}
.fb-wrong-circle {
  width: 100px; height: 100px; border-radius: 50%; background: #E8F4FD;
  display: flex; align-items: center; justify-content: center; font-size: 40px;
  box-shadow: 0 6px 20px rgba(74,144,217,0.25);
}
.fb-wrong-text { font-size: 20px; color: #4A90D9; font-weight: 600; }
@keyframes wrongPop {
  0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.6); }
  15%  { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  85%  { opacity: 1; }
  100% { opacity: 0; }
}

.option-btn.fb-blink { animation: correctBlink 0.3s ease; }
@keyframes correctBlink {
  0%, 100% { box-shadow: 0 0 0 0 rgba(76,175,80,0); background: transparent; }
  50%      { box-shadow: 0 0 0 4px rgba(76,175,80,0.6); background: rgba(76,175,80,0.25); border-color: #4CAF50; }
}

.fb-fly-star {
  position: fixed; font-size: 48px; z-index: 190; pointer-events: none;
  transform: translate(-50%,-50%);
}
.fb-counter-bump { animation: counterBump 0.3s ease; }
@keyframes counterBump {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.4); }
  100% { transform: scale(1); }
}
.fb-counter-gold { animation: counterGold 0.3s ease; }
@keyframes counterGold {
  0%   { color: inherit; }
  50%  { color: #FFD700; }
  100% { color: inherit; }
}

.fb-achievement {
  position: fixed; left: 50%; top: 40%; transform: translate(-50%,-50%);
  font-size: 48px; font-weight: 800; z-index: 210; pointer-events: none;
  color: #FFD700; text-shadow: 0 4px 16px rgba(0,0,0,0.2);
  animation: achievementPop 1.5s ease forwards;
}
@keyframes achievementPop {
  0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.5); }
  20%  { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
  40%  { transform: translate(-50%,-50%) scale(1); }
  80%  { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%,-50%) scale(1.05); }
}

/* ---- Results Page ---- */
.results-container {
  flex:1;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:20px;
  text-align:center;
}
.results-emoji { font-size:80px; }
.results-score { font-size:28px; font-weight:600; }
.results-stars { font-size:24px; color:var(--coral); }
.results-btn {
  background: var(--teal); color: white; border: none;
  padding: 16px 48px; border-radius: 50px;
  font-size: 22px; font-weight: 600; cursor: pointer;
  box-shadow: var(--shadow-lg);
  font-family: var(--font);
  transition: transform 0.2s;
}
.results-btn:active { transform: scale(0.95); }

/* ---- Admin Panel ---- */
.admin-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  z-index: 200; display: flex; align-items: flex-end;
}
.admin-panel {
  background: var(--white); width: 100%; max-width: 520px;
  margin: 0 auto; border-radius: 24px 24px 0 0;
  max-height: 85vh; overflow-y: auto;
  box-shadow: 0 -4px 24px rgba(0,0,0,0.12);
  padding: 24px 20px 40px;
}
.admin-panel h2 { font-size: 24px; font-weight: 600; margin-bottom: 16px; }
.admin-section { margin-bottom: 20px; }
.admin-section label { font-size: 16px; font-weight: 600; display: block; margin-bottom: 6px; }
.admin-section input, .admin-section select {
  width: 100%; padding: 12px 16px; border: 2px solid #eee;
  border-radius: var(--radius-sm); font-size: 18px;
  font-family: var(--font);
}
.admin-section input:focus { border-color: var(--teal); outline: none; }

.admin-tabs {
  display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto;
}
.admin-tab {
  padding: 8px 16px; border-radius: 50px;
  border: 2px solid #eee; background: white;
  font-size: 15px; cursor: pointer; white-space: nowrap;
  font-family: var(--font);
}
.admin-tab.active { background: var(--teal-pale); border-color: var(--teal); }

.question-list { display: flex; flex-direction: column; gap: 10px; }
.question-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; background: #f8f8f8;
  border-radius: var(--radius-sm); font-size: 16px;
}
.question-item .q-preview { flex:1; }
.question-item .q-emoji { font-size: 28px; }
.question-item button {
  background: none; border: none; font-size: 18px; cursor: pointer;
  padding: 4px 8px; border-radius: 8px;
}
.question-item .edit-btn { color: var(--teal); }
.question-item .del-btn { color: var(--coral); }

.admin-actions { display: flex; gap: 10px; margin-top: 16px; }
.btn {
  padding: 10px 20px; border-radius: 50px;
  font-size: 16px; font-weight: 600; cursor: pointer; border: none;
  font-family: var(--font);
}
.btn-primary { background: var(--teal); color: white; }
.btn-danger { background: var(--coral); color: white; }
.btn-outline { background: white; border: 2px solid #eee; }

.admin-form {
  background: var(--teal-pale); padding: 16px;
  border-radius: var(--radius-sm); margin-top: 12px;
}
.admin-form input {
  width: 100%; padding: 10px 14px; border: 2px solid #ddd;
  border-radius: 8px; font-size: 16px; margin-bottom: 8px;
  font-family: var(--font);
}
.admin-form .form-row { display: flex; gap: 8px; }
.admin-form .form-row input { flex: 1; }

.close-admin {
  position: sticky; top: 0; float: right;
  background: #eee; border: none; width: 36px; height: 36px;
  border-radius: 50%; font-size: 18px; cursor: pointer;
}

.hidden { display: none !important; }

@media (max-width: 400px) {
  .home-grid { gap: 10px; }
  .module-card { padding: 20px 12px; }
  .module-card .emoji { font-size: 40px; }
  .module-card .label { font-size: 18px; }
  .question-emoji { font-size: 56px; }
  .question-text { font-size: 40px; }
  .option-btn { font-size: 24px; padding: 16px 10px; min-height: 68px; }
}
</style>
</head>
<body>

<canvas id="confetti"></canvas>
<div id="feedbackOverlay" class="feedback-overlay hidden">
  <span id="feedbackText" class="feedback-text"></span>
</div>

<div id="app">
  <header>
    <div class="greeting">Hi, <span class="name" id="childName">宝宝</span></div>
    <div class="star-badge">
      <span class="star-icon">⭐</span>
      <span id="starCount">0</span>
    </div>
    <button class="admin-btn" id="adminBtn" title="家长管理">🔧</button>
  </header>

  <!-- Home -->
  <div id="viewHome" class="home-grid">
    <div class="module-card card-characters" data-module="characters">
      <div class="emoji">📖</div>
      <div class="label">识字</div>
      <div class="desc">认汉字，学词语</div>
    </div>
    <div class="module-card card-pinyin" data-module="pinyin">
      <div class="emoji">🔤</div>
      <div class="label">拼音</div>
      <div class="desc">学声母和韵母</div>
    </div>
    <div class="module-card card-counting" data-module="counting">
      <div class="emoji">🔢</div>
      <div class="label">数数</div>
      <div class="desc">数一数有多少</div>
    </div>
    <div class="module-card card-math" data-module="math">
      <div class="emoji">🧮</div>
      <div class="label">加减</div>
      <div class="desc">10以内加减法</div>
    </div>
    <div class="module-card card-memory" data-module="memory">
      <div class="emoji">🧠</div>
      <div class="label">记忆配对</div>
      <div class="desc">翻牌找相同</div>
    </div>
    <div class="module-card card-pattern" data-module="pattern">
      <div class="emoji">🧩</div>
      <div class="label">找规律</div>
      <div class="desc">发现排列规律</div>
    </div>
    <div class="module-card card-classify" data-module="classify">
      <div class="emoji">🗂️</div>
      <div class="label">分类</div>
      <div class="desc">找出不同类</div>
    </div>
  </div>

  <div id="ttsTip" class="tts-tip" hidden>🔇 当前浏览器不支持语音朗读，请改用 Safari 或 Chrome 打开</div>

  <!-- Quiz -->
  <div id="viewQuiz" class="quiz-container hidden">
    <div class="quiz-header">
      <button class="back-btn" id="quizBack">←</button>
      <span class="quiz-title" id="quizTitle"></span>
      <button class="replay-btn" id="replayBtn" title="重新读题">🔊</button>
    </div>
    <div class="progress-wrap">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
    <div class="question-area" id="questionArea"></div>
    <div class="options-grid" id="optionsGrid"></div>
  </div>

  <!-- Results -->
  <div id="viewResults" class="results-container hidden">
    <div class="results-emoji" id="resultsEmoji"></div>
    <div class="results-score" id="resultsScore"></div>
    <div class="results-stars" id="resultsStars"></div>
    <button class="results-btn" id="resultsBack">返回乐园</button>
  </div>
</div>

<!-- Admin Panel Overlay -->
<div id="adminOverlay" class="admin-overlay hidden">
  <div class="admin-panel" id="adminPanel"></div>
</div>

<script>
(function(){
'use strict';

/* ========== STATE & STORAGE ========== */

const STORAGE_KEY = 'knowledge_park_data';

function defaultData() {
  return {
    childName: '宝宝',
    stars: 0,
      soundEnabled: true,
      ttsEnabled: true,
      quizBank: {
        characters: [
        {emoji:'🍎',options:['苹果','香蕉','西瓜','葡萄'],correct:'苹果'},
        {emoji:'🐱',options:['狗','兔子','猫','鱼'],correct:'猫'},
        {emoji:'🌙',options:['太阳','月亮','星星','云朵'],correct:'月亮'},
        {emoji:'👀',options:['耳朵','鼻子','眼睛','嘴巴'],correct:'眼睛'},
        {emoji:'🟡',options:['红色','蓝色','黄色','绿色'],correct:'黄色'},
        {emoji:'🍌',options:['苹果','西瓜','葡萄','香蕉'],correct:'香蕉'},
        {emoji:'🐶',options:['猫','鱼','兔子','狗'],correct:'狗'},

let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playTone(freq, type, duration, startTime, vol) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(startTime);
  gain.gain.setValueAtTime(vol || 0.25, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.stop(startTime + duration);
}

function playCorrectSound() {
  if (!appData.soundEnabled) return;
  initAudio();
  const now = audioCtx.currentTime;
  playTone(523.25, 'sine', 0.18, now, 0.25);      // C5
  playTone(659.25, 'sine', 0.18, now + 0.12, 0.25); // E5
  playTone(783.99, 'sine', 0.30, now + 0.24, 0.30); // G5
}

function playWrongSound() {
  if (!appData.soundEnabled) return;
  initAudio();
  const now = audioCtx.currentTime;
  playTone(220.00, 'triangle', 0.25, now, 0.25);      // A3
  playTone(196.00, 'triangle', 0.35, now + 0.25, 0.25); // G3
}

/* ========== TTS 语音朗读 ========== */
let currentSpeakText = '';
const ttsSupported = ('speechSynthesis' in window);
let ttsVoices = [];
let ttsReady = false;   // iOS 需要首次在用户手势内激活语音引擎
function loadTtsVoices() {
  if (!ttsSupported) return;
  try { ttsVoices = window.speechSynthesis.getVoices() || []; } catch(e) { ttsVoices = []; }
}
if (ttsSupported) {
  loadTtsVoices();
  try { window.speechSynthesis.onvoiceschanged = loadTtsVoices; } catch(e) {}
}
// 预热：在用户手势内先播一个静音空句，解锁 iOS 语音引擎
function warmUpTts() {
  if (!ttsSupported || ttsReady) return;
  try {
    const u = new SpeechSynthesisUtterance('');
    u.volume = 0;
    window.speechSynthesis.speak(u);
    ttsReady = true;
  } catch(e) {}
}
// 首次任意交互即解锁（点击模块卡片时也会触发，确保在读题前激活）
if (ttsSupported) {
  ['touchstart', 'click'].forEach(function(ev) {
    window.addEventListener(ev, warmUpTts, { once: true, passive: true });
  });
}
function speak(text) {
  if (!appData.ttsEnabled || !ttsSupported || !text) return;
  try {
    if (!ttsVoices.length) loadTtsVoices();   // 刷新 voices（iOS 异步加载）
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'zh-CN';
    u.rate = 0.9;
    u.pitch = 1.1;
    const zh = ttsVoices.find(function(v){ return /^zh/i.test(v.lang || ''); }) ||
               ttsVoices.find(function(v){ return /chinese|中文|普通话/i.test(v.name || ''); });
    if (zh) u.voice = zh;
    if (!ttsReady) warmUpTts();               // 首次先解锁引擎
    window.speechSynthesis.cancel();
    // iOS: cancel 后立即 speak 会静默，延迟一点再播
    setTimeout(function() {
      try { window.speechSynthesis.speak(u); } catch(e) {}
    }, ttsReady ? 60 : 120);
  } catch(e) {}
}

const confettiCanvas = $('#confetti');
const ctx = confettiCanvas.getContext('2d');
let confettiParticles = [];
let confettiAnimId = null;

function resizeConfetti() {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeConfetti);
resizeConfetti();

function spawnConfetti() {
  const colors = ['#FF6B6B','#4ECDC4','#FFE66D','#A78BFA','#F59E0B','#FF8E8E','#6FE0DB'];
  for (let i = 0; i < 60; i++) {
    confettiParticles.push({
      x: Math.random() * confettiCanvas.width,
      y: -10 - Math.random() * 40,
      w: 6 + Math.random() * 10,
      h: 4 + Math.random() * 8,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 4,
      vy: 2 + Math.random() * 5,
      rotation: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 10,
      opacity: 1
    });
  }
  if (!confettiAnimId) {
    function animate() {
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      let alive = false;
      for (let i = confettiParticles.length - 1; i >= 0; i--) {
        const p = confettiParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.08;
        p.rotation += p.rotSpeed;
        p.opacity -= 0.008;
        if (p.opacity <= 0 || p.y > confettiCanvas.height + 20) {
          confettiParticles.splice(i, 1);
        } else {
          alive = true;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation * Math.PI / 180);
          ctx.globalAlpha = p.opacity;
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
          ctx.restore();
        }
      }
      if (alive) { confettiAnimId = requestAnimationFrame(animate); }
      else { confettiAnimId = null; confettiParticles = []; ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height); }
    }
    confettiAnimId = requestAnimationFrame(animate);
  }
}

function stopConfetti() {
  if (confettiAnimId) {
    cancelAnimationFrame(confettiAnimId);
    confettiAnimId = null;
  }
  confettiParticles = [];
  ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
}

/* ========== QUIZ ENGINE ========== */

let quizState = null;

function generateCountingQuestions() {
  const emojis = ['🍎','🍊','🍋','🍇','🍓','🌸','⭐','🐱','🐶','🐰','🐟','🦋','🌺','🍭','🎈'];
  const questions = [];
  /* 前 6 题：数一数；后 4 题：比一比 */
  for (let i = 0; i < 10; i++) {
    if (i < 6) {
      /* ---- 数一数 ---- */
      const count = 1 + Math.floor(Math.random() * 10);
      const emoji = emojis[Math.floor(Math.random() * emojis.length)];
      const correct = String(count);
      const opts = new Set([correct]);
      let safety = 0;
      while (opts.size < 4 && safety < 100) {
        safety++;
        const cand = String(1 + Math.floor(Math.random() * 10));
        opts.add(cand);
      }
      const shuffledOpts = shuffle([...opts]);
      questions.push({ type:'count', count, emoji, options: shuffledOpts, correct });
    } else {
      /* ---- 比一比 ---- */
      const leftCount = 2 + Math.floor(Math.random() * 9);    /* 2~10 */
      const rightCount = 2 + Math.floor(Math.random() * 9);   /* 2~10 */
      /* 避免左右完全相等几率太高：若相等则调整一侧 */
      const adjustedRight = rightCount === leftCount
        ? (leftCount >= 6 ? leftCount - 1 : leftCount + 1)
        : rightCount;
      const leftEmoji = emojis[Math.floor(Math.random() * emojis.length)];
      let rightEmoji = emojis[Math.floor(Math.random() * emojis.length)];
      while (rightEmoji === leftEmoji) rightEmoji = emojis[Math.floor(Math.random() * emojis.length)];
      /* 随机问"哪边多" 或 "哪边少" */
      const askMore = Math.random() > 0.5;
      const largerSide = leftCount > adjustedRight ? 'left' : 'right';
      const smallerSide = leftCount > adjustedRight ? 'right' : 'left';
      const answer = askMore ? largerSide : smallerSide;
      const allOpts = shuffle(['left', 'right']);
      /* 4 个选项：正确 + 另一边 + "一样多" + "😅" */
      const labels = {
        left: '左边更多',
        right: '右边更多'
      };
      if (askMore) {
        labels.left = '左边更多';
        labels.right = '右边更多';
      } else {
        labels.left = '左边更少';
        labels.right = '右边更少';
      }
      const options = [
        labels[answer],
        labels[answer === 'left' ? 'right' : 'left'],
        leftCount === adjustedRight ? '一样多' : (askMore ? '一样多' : '一样多'),
        '😅 不知道'
      ];
      const correct = labels[answer];
      questions.push({
        type: 'compare',
        left: { count: leftCount, emoji: leftEmoji },
        right: { count: adjustedRight, emoji: rightEmoji },
        question: askMore ? '哪边更多？' : '哪边更少？',
        options,
        correct
      });
    }
  }
  return questions;
}

function generateMathQuestions(maxNum) {
  maxNum = maxNum || 10;
  const questions = [];
  for (let i = 0; i < 10; i++) {
    const isAdd = Math.random() > 0.5;
    let a, b, answer, question;
    if (isAdd) {
      answer = 2 + Math.floor(Math.random() * (maxNum - 1));
      a = 1 + Math.floor(Math.random() * (answer - 1));
      b = answer - a;
      question = a + ' + ' + b + ' = ?';
    } else {
      a = 2 + Math.floor(Math.random() * (maxNum - 1));
      b = 1 + Math.floor(Math.random() * a);
      answer = a - b;
      question = a + ' - ' + b + ' = ?';
    }
    const correct = String(answer);
    const opts = new Set([correct]);
    let safety = 0;
    while (opts.size < 4 && safety < 100) {
      safety++;
      const cand = String(Math.floor(Math.random() * (maxNum + 1)));
      opts.add(cand);
    }
    const shuffledOpts = shuffle([...opts]);
    questions.push({ question, options: shuffledOpts, correct });
  }
  return questions;
}

function generatePatternQuestions() {
  const allEmojis = ['🍎','🍊','🍋','🍇','🍓','🍉','🍌','🍒','🥝','🍑','🥕','🌽','🍄','🌰','🍪'];
  const patterns = ['ABAB', 'AAB', 'ABB', 'ABC'];
  const questions = [];
  for (let i = 0; i < 10; i++) {
    const type = patterns[Math.floor(Math.random() * patterns.length)];
    const pool = shuffle([...allEmojis]).slice(0, 3);
    const A = pool[0], B = pool[1], C = pool[2];
    let sequence = [];
    if (type === 'ABAB') {
      sequence = [A, B, A, B, A, null];
    } else if (type === 'AAB') {
      sequence = [A, A, B, A, A, null];
    } else if (type === 'ABB') {
      sequence = [A, B, B, A, B, null];
    } else if (type === 'ABC') {
      sequence = [A, B, C, A, B, null];
    }
    const correct = sequence[sequence.length - 1] || (type === 'ABC' ? C : (type === 'ABAB' || type === 'ABB' ? B : B));
    const shownSequence = sequence.slice(0, -1);
    const opts = new Set([correct]);
    let safety = 0;
    while (opts.size < 4 && safety < 100) {
      safety++;
      opts.add(allEmojis[Math.floor(Math.random() * allEmojis.length)]);
    }
    questions.push({
      type: 'pattern',
      sequence: shownSequence,
      patternType: type,
      options: shuffle([...opts]),
      correct
    });
  }
  return questions;
}

function generateClassificationQuestions() {
  const categories = [
    { name: '水果', items: ['🍎','🍊','🍇','🍓','🍌','🍉','🍒','🍑'] },
    { name: '动物', items: ['🐱','🐶','🐰','🐼','🐯','🦁','🐷','🐸'] },
    { name: '交通工具', items: ['🚗','🚌','🚕','🚓','🚑','🚒','🚜','🚲'] },
    { name: '食物', items: ['🍚','🍜','🍔','🍕','🍰','🍩','🍪','🍫'] },
    { name: '文具', items: ['✏️','🖍️','📏','✂️','🎒','📐','📝','📘'] },
    { name: '衣服', items: ['👕','👖','👗','👔','🧦','🧥','🧢','👟'] },
    { name: '运动', items: ['⚽','🏀','🏐','⚾','🎾','🏓','🏸','🏒'] },
    { name: '家具', items: ['🛏️','🪑','🚪','🪟','🛋️','🚽','🪞','🧺'] }
  ];
  const questions = [];
  for (let i = 0; i < 10; i++) {
    const mainIdx = Math.floor(Math.random() * categories.length);
    let oddIdx = Math.floor(Math.random() * categories.length);
    while (oddIdx === mainIdx) oddIdx = Math.floor(Math.random() * categories.length);
    const mainCat = categories[mainIdx];
    const oddCat = categories[oddIdx];
    const mainItems = shuffle([...mainCat.items]).slice(0, 3);
    const oddItem = oddCat.items[Math.floor(Math.random() * oddCat.items.length)];
    const allItems = shuffle([...mainItems, oddItem]);
    questions.push({
      type: 'classify',
      items: allItems,
      mainCategory: mainCat.name,
      options: allItems,
      correct: oddItem
    });
  }
  return questions;
}

/* ========== MEMORY GAME ========== */
let memoryState = null;

function startMemoryGame() {
  stopConfetti();
  quizTitle.textContent = '🧠 记忆配对';
  if (replayBtn) replayBtn.style.display = 'none';
  currentSpeakText = '';
  progressFill.style.width = '0%';
  memoryState = null;

  const pairs = ['🍎','🍊','🍇','🍓','🍌','🍉'];
  const cards = shuffle([...pairs, ...pairs]).map((emoji, idx) => ({
    id: idx,
    emoji,
    flipped: false,
    matched: false
  }));

  memoryState = {
    cards,
    flipped: [],
    locked: false,
    matchedPairs: 0,
    totalPairs: pairs.length,
    attempts: 0
  };

  quizState = null;
  showView(viewQuiz);
  renderMemoryGrid();
}

function renderMemoryGrid() {
  if (!memoryState) return;
  const infoHTML = '<div class="memory-info">翻开两张相同的卡片就配对成功！</div>';
  let gridHTML = '<div class="memory-grid">';
  memoryState.cards.forEach(card => {
    const classes = ['memory-card'];
    if (card.flipped) classes.push('flipped');
    if (card.matched) classes.push('matched');
    gridHTML +=
      '<button class="' + classes.join(' ') + '" data-memory-id="' + card.id + '">' +
        '<span class="card-back">?</span>' +
        '<span class="card-face">' + card.emoji + '</span>' +
      '</button>';
  });
  gridHTML += '</div>';
  questionArea.innerHTML = infoHTML + gridHTML;
  optionsGrid.innerHTML = '';
}

function handleMemoryCardClick(cardEl) {
  if (!memoryState || memoryState.locked) return;
  const id = parseInt(cardEl.dataset.memoryId);
  const card = memoryState.cards.find(c => c.id === id);
  if (!card || card.flipped || card.matched) return;

  card.flipped = true;
  memoryState.flipped.push(card);
  const nm = EMOJI_NAMES[card.emoji];
  if (nm) speak(nm);
  renderMemoryGrid();

  if (memoryState.flipped.length === 2) {
    memoryState.attempts++;
    const [c1, c2] = memoryState.flipped;
    if (c1.emoji === c2.emoji) {
      c1.matched = true;
      c2.matched = true;
      memoryState.matchedPairs++;
      memoryState.flipped = [];
      playCorrectSound();
      if (memoryState.matchedPairs >= memoryState.totalPairs) {
        setTimeout(finishMemoryGame, 600);
      } else {
        renderMemoryGrid();
      }
    } else {
      memoryState.locked = true;
      setTimeout(() => {
        c1.flipped = false;
        c2.flipped = false;
        memoryState.flipped = [];
        memoryState.locked = false;
        renderMemoryGrid();
      }, 1000);
    }
  }
}

function finishMemoryGame() {
  const total = memoryState.totalPairs;
  /* 完成记忆游戏直接奖励 3 颗星 */
  const reward = 3;
  appData.stars += reward;
  saveData(appData);
  refreshHeader();
  spawnConfetti();
  flyStarToCounter();
  checkStarAchievement();
  quizState = {
    module: 'memory',
    questions: new Array(total).fill(null),
    currentIndex: 0,
    score: total,
    answered: false,
    firstTry: true,
    wrongAttempts: 0
  };
  memoryState = null;
  showResults();
}

function renderQuestion() {

  const idx = quizState.currentIndex;

  progressFill.style.width = ((idx / total) * 100) + '%';

  quizState.firstTry = true;
  quizState.wrongAttempts = 0;

      const rightEmojis = Array(q.right.count).fill(q.right.emoji).join(' ');

            '<div style="font-size:18px; color:#888; margin-top:4px;">左边</div>' +
          '</div>' +

          '</div>' +
        '</div>' +

      qHTML = '<div class="question-emoji" style="font-size:48px; word-break:break-all; line-height:1.8;">' + emojis + '</div>' +

    qHTML = '<div class="question-text" style="font-size:40px;">' + q.question + '</div>' +
            '<div class="question-label">算一算，选答案</div>';
  } else if (module === 'pattern') {
    const seqHTML = q.sequence.map(item =>
      '<span style="display:inline-block; margin:0 6px;">' + item + '</span>'
    ).join('') +
    '<span style="display:inline-block; margin:0 6px; color:var(--coral); font-weight:bold;">?</span>';
    qHTML = '<div class="question-emoji" style="font-size:42px;">' + seqHTML + '</div>' +
            '<div class="question-label">下一个是什么？</div>';
  } else if (module === 'classify') {
    const itemsHTML = q.items.map(item =>
      '<span style="display:inline-block; margin:0 8px;">' + item + '</span>'
    ).join('');
    qHTML = '<div class="question-emoji" style="font-size:46px;">' + itemsHTML + '</div>' +
            '<div class="question-label">哪个不是「' + q.mainCategory + '」？</div>';
  }

  questionArea.innerHTML = qHTML;

  let optHTML = '';
  q.options.forEach((opt, i) => {
    optHTML += '<button class="option-btn" data-index="' + i + '">' + opt + '</button>';
  });
  optionsGrid.innerHTML = optHTML;

  let speakText = '';
  if (module === 'characters') speakText = '这是什么？点下面的字';
  else if (module === 'pinyin') speakText = '请选出读音';
  else if (module === 'counting') speakText = (q.type === 'compare') ? q.question : '数一数，一共有几个？';
  else if (module === 'math') speakText = '算一算，' + q.question.replace('=', '等于');
  else if (module === 'pattern') speakText = '接下来应该是什么？';
  else if (module === 'classify') speakText = '哪个不是' + q.mainCategory + '？';
  currentSpeakText = speakText;
  if (replayBtn) replayBtn.style.display = '';
  speak(speakText);
}

function handleAnswer(btn) {
  if (!quizState || quizState.answered) return;
  const chosenIdx = parseInt(btn.dataset.index);
  const q = quizState.questions[quizState.currentIndex];
  const chosen = q.options[chosenIdx];
  const isCorrect = (chosen === q.correct);

  if (isCorrect) {
    playCorrectSound();
    quizState.answered = true;
    btn.classList.add('correct');
    document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

    document.querySelectorAll('.option-btn').forEach(b => {
      if (b.dataset.index == q.options.indexOf(q.correct)) {
        b.classList.add('correct');
      }
    });

    if (quizState.firstTry) {
      quizState.score++;
      appData.stars++;
      saveData(appData);
      refreshHeader();
      spawnConfetti();
      onCorrectAnswer(btn, true);
    } else {
      onCorrectAnswer(btn, false);
    }

    setTimeout(nextQuestion, 1500);
  } else {
    playWrongSound();
    btn.classList.add('wrong');
    const correctIdx = q.options.indexOf(q.correct);
    const correctBtn = document.querySelector('.option-btn[data-index="' + correctIdx + '"]');
    const isFinal = quizState.wrongAttempts >= 2;
    onWrongAnswer(correctBtn, isFinal);
    quizState.firstTry = false;
    quizState.wrongAttempts++;
    if (quizState.wrongAttempts >= 3) {
      quizState.answered = true;
      document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
      document.querySelectorAll('.option-btn').forEach(b => {
        if (b.dataset.index == q.options.indexOf(q.correct)) {
          b.classList.add('correct');
        }
      });
      setTimeout(nextQuestion, 2000);
    } else {
      setTimeout(() => btn.classList.remove('wrong'), 600);
    }
  }
}

function nextQuestion() {
  quizState.currentIndex++;
  if (quizState.currentIndex >= quizState.questions.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

function showResults() {
  const score = quizState.score;
  const total = quizState.questions.length;
  const pct = score / total;

  let emoji, message;
  if (pct >= 0.9) { emoji = '🏆'; message = '太厉害了！'; }
  else if (pct >= 0.7) { emoji = '🎉'; message = '非常棒！'; }
  else if (pct >= 0.5) { emoji = '👍'; message = '不错哦！'; }
  else { emoji = '💪'; message = '继续加油！'; }

  resultsEmoji.textContent = emoji;
  resultsScore.innerHTML = message + '<br><span style="font-size:18px;color:#888;">本轮得分 ' + score + ' / ' + total + '</span>';
  resultsStars.textContent = '共获得 ' + appData.stars + ' 颗星星 ⭐';

  if (pct >= 0.7) spawnConfetti();
  showView(viewResults);

  saveData(appData);
}

      $('#editOpt1').value.trim(),
      $('#editOpt2').value.trim(),
      $('#editOpt3').value.trim()
    ];
    if (!opts[0]) { alert('请至少填写选项1（正确答案）'); return; }
    const filled = opts.filter(o => o);
    if (filled.length < 2) { alert('请至少填写2个选项'); return; }

    q.options = filled;
    q.correct = opts[0];
    if (adminModule === 'characters') {
      q.emoji = $('#editEmoji').value.trim() || '❓';
      delete q.pinyin;
    } else {
      q.pinyin = $('#editPinyin').value.trim() || '?';
      delete q.emoji;
    }
    saveData(appData);
    renderAdmin();
  });

  $('#cancelEdit').addEventListener('click', () => renderAdmin());
}

function openAdmin() {
  adminModule = 'characters';
  renderAdmin();
  adminOverlay.classList.remove('hidden');
}

function closeAdmin() {
  adminOverlay.classList.add('hidden');
}

/* ========== NAVIGATION EVENTS ========== */

viewHome.addEventListener('click', function(e) {
  const card = e.target.closest('.module-card');
  if (!card) return;
  const module = card.dataset.module;
  if (module) startQuiz(module);
});

optionsGrid.addEventListener('click', function(e) {
  const btn = e.target.closest('.option-btn');
  if (!btn || btn.disabled) return;
  if (btn.classList.contains('math-diff-btn')) {
    startMathQuiz(parseInt(btn.dataset.max));
    return;
  }
  const optTxt = btn.textContent.trim();
  if (/[\u4e00-\u9fa50-9]/.test(optTxt)) speak(optTxt);
  handleAnswer(btn);
});

questionArea.addEventListener('click', function(e) {
  const card = e.target.closest('.memory-card');
  if (!card) return;
  handleMemoryCardClick(card);
});

$('#quizBack').addEventListener('click', () => {
  stopConfetti();
  quizState = null;
  memoryState = null;
  showView(viewHome);
});
$('#replayBtn').addEventListener('click', function() {
  if (currentSpeakText) speak(currentSpeakText);
});
$('#resultsBack').addEventListener('click', () => {
  stopConfetti();
  quizState = null;
  memoryState = null;
  showView(viewHome);
});
$('#adminBtn').addEventListener('click', openAdmin);
adminOverlay.addEventListener('click', function(e) {
  if (e.target === adminOverlay) closeAdmin();
});

/* ========== INIT ========== */

if (!ttsSupported && replayBtn) replayBtn.style.display = 'none';
if (!ttsSupported) { const t = document.getElementById('ttsTip'); if (t) t.hidden = false; }
refreshHeader();
initFeedbackSystem();
showView(viewHome);

})();
</script>
</body>
</html>
