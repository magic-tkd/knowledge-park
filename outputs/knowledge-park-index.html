<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>幼小衔接知识乐园</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Baloo+2:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --coral: #FF6B6B;
  --coral-light: #FF8E8E;
  --coral-pale: #FFF0F0;
  --teal: #4ECDC4;
  --teal-light: #6FE0DB;
  --teal-pale: #E8FAF8;
  --yellow: #FFE66D;
  --yellow-pale: #FFFBE6;
  --bg: #FFF9F5;
  --white: #FFFFFF;
  --text: #3D3D3D;
  --text-light: #888888;
  --radius: 20px;
  --radius-sm: 12px;
  --shadow: 0 4px 20px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 32px rgba(0,0,0,0.10);
  --font: 'ZCOOL KuaiLe','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  --font-num: 'Baloo 2','ZCOOL KuaiLe','PingFang SC',sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: var(--font);
  background:
    radial-gradient(circle at 18% -5%, #FFE3DE 0%, transparent 42%),
    radial-gradient(circle at 88% 8%, #D8F5F1 0%, transparent 40%),
    linear-gradient(180deg, #FFF9F5 0%, #FFF3EE 100%);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}

/* 背景柔光装饰：气泡与浮云，固定全屏，不挡操作 */
.bg-decor { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bg-decor::before,
.bg-decor::after { content:''; position:absolute; border-radius:50%; opacity:0.55; }
.bg-decor::before { width:170px; height:170px; left:-46px; top:16%; background:radial-gradient(circle at 35% 35%, #FFD8D0, #FFE9E4); }
.bg-decor::after  { width:130px; height:130px; right:-34px; bottom:13%; background:radial-gradient(circle at 35% 35%, #C9F0EB, #E6FAF7); }
.bg-decor .bubble { position:absolute; border-radius:50%; background:rgba(255,255,255,0.6); }
.bg-decor .b1 { width:46px; height:46px; left:12%; top:62%; }
.bg-decor .b2 { width:30px; height:30px; right:18%; top:30%; }
.bg-decor .b3 { width:22px; height:22px; left:42%; top:13%; }

canvas#confetti {
  position: fixed; top:0; left:0; width:100%; height:100%;
  pointer-events: none; z-index: 9999;
}

#app {
  position: relative;
  z-index: 1;
  max-width: 520px;
  margin: 0 auto;
  padding: 16px 16px 24px;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 20px;
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 20px;
}

header .greeting { font-size: 22px; font-weight: 600; }
header .greeting .name { color: var(--coral); }
header .star-badge {
  display: flex; align-items: center; gap: 6px;
  background: var(--yellow-pale);
  padding: 8px 16px; border-radius: 50px;
  font-size: 20px; font-weight: 600;
  font-family: var(--font-num);
}
header .star-badge .star-icon {
  font-size: 26px;
  animation: starPulse 2s ease-in-out infinite;
}
@keyframes starPulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

.admin-btn {
  background: none; border: 2px dashed #ddd; color: #bbb;
  width: 36px; height: 36px; border-radius: 50%;
  font-size: 16px; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  transition: all 0.2s;
}
.admin-btn:hover { border-color: var(--text-light); color: var(--text-light); }

/* ---- Home Page ---- */
.home-grid {
  flex: 1;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  align-content: start;
}

.tts-tip {
  margin: 14px 4px 0;
  padding: 10px 14px;
  background: #fff4e0;
  border: 1px solid #ffd591;
  border-radius: 14px;
  color: #ad6800;
  font-size: 15px;
  text-align: center;
  line-height: 1.5;
}
.home-grid .module-card:last-child:nth-child(odd) {
  grid-column: 1 / -1;
}

.module-card {
  background: var(--white);
  border-radius: var(--radius);
  padding: 24px 16px;
  text-align: center;
  cursor: pointer;
  box-shadow: var(--shadow-lg);
  transition: transform 0.2s, box-shadow 0.2s;
  border: 3px solid transparent;
  position: relative;
  overflow: hidden;
  animation: cardPop 0.5s cubic-bezier(0.22, 1.2, 0.36, 1) both;
}
.module-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 54%;
  background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0));
  pointer-events: none;
}
.module-card:active { transform: scale(0.94); box-shadow: var(--shadow); }
@keyframes cardPop {
  0%   { opacity: 0; translate: 0 24px; scale: 0.82; }
  100% { opacity: 1; translate: 0 0; scale: 1; }
}
.home-grid .module-card:nth-child(1) { animation-delay: 0.04s; }
.home-grid .module-card:nth-child(2) { animation-delay: 0.09s; }
.home-grid .module-card:nth-child(3) { animation-delay: 0.14s; }
.home-grid .module-card:nth-child(4) { animation-delay: 0.19s; }
.home-grid .module-card:nth-child(5) { animation-delay: 0.24s; }
.home-grid .module-card:nth-child(6) { animation-delay: 0.29s; }
.home-grid .module-card:nth-child(7) { animation-delay: 0.34s; }
.home-grid .module-card:nth-child(8) { animation-delay: 0.39s; }
.home-grid .module-card:nth-child(9) { animation-delay: 0.44s; }
.home-grid .module-card:nth-child(10) { animation-delay: 0.49s; }
.module-card .emoji { font-size: 48px; margin-bottom: 8px; }
.module-card .label { font-size: 22px; font-weight: 600; }
.module-card .desc {
  font-size: 14px; color: var(--text-light); margin-top: 4px;
}

.card-characters { border-color: var(--coral); background: rgba(255,107,107,0.10); }
.card-characters .label { color: var(--coral); }
.card-pinyin { border-color: var(--teal); background: rgba(78,205,196,0.12); }
.card-pinyin .label { color: var(--teal); }
.card-counting { border-color: #A78BFA; background: rgba(167,139,250,0.12); }
.card-counting .label { color: #A78BFA; }
.card-math { border-color: #F59E0B; background: rgba(245,158,11,0.12); }
.card-math .label { color: #F59E0B; }
.card-pattern { border-color: #34D399; background: rgba(52,211,153,0.12); }
.card-pattern .label { color: #34D399; }
.card-classify { border-color: #F472B6; background: rgba(244,114,182,0.12); }
.card-classify .label { color: #F472B6; }
.card-memory { border-color: #60A5FA; background: rgba(96,165,250,0.12); }
.card-memory .label { color: #60A5FA; }
.card-english { border-color: #FBBF24; background: rgba(251,191,36,0.12); }
.card-english .label { color: #FBBF24; }
.card-english .emoji { color: #FBBF24; }
.card-books { border-color: #FB7185; background: rgba(251,113,133,0.12); }
.card-books .label { color: #FB7185; }
.card-books .emoji { color: #FB7185; }
.card-clock { border-color: #38BDF8; background: rgba(56,189,248,0.12); }
.card-clock .label { color: #38BDF8; }
.card-clock .emoji { color: #38BDF8; }
.card-games { border-color: #C084FC; background: rgba(192,132,252,0.12); }
.card-games .label { color: #C084FC; }
.card-games .emoji { color: #C084FC; }
.home-grid .module-card:nth-child(11) { animation-delay: 0.54s; }

/* 迷宫 */
.maze-container { padding: 16px; max-width: 520px; margin: 0 auto; }
.maze-diff { display: flex; justify-content: center; gap: 10px; margin: 14px 0 18px; flex-wrap: wrap; }
.maze-diff-btn { font-family: var(--font); font-size: 18px; padding: 10px 20px; border: 2px solid var(--coral); background: #fff; color: var(--coral); border-radius: 40px; cursor: pointer; box-shadow: var(--shadow); }
.maze-diff-btn.active { background: var(--coral); color: #fff; }
.maze-diff-btn:active { transform: scale(0.95); }
.maze-board { display: flex; justify-content: center; touch-action: manipulation; }
.maze-svg { width: 100%; max-width: 340px; height: auto; background: #fff; border-radius: 16px; box-shadow: var(--shadow); }
.maze-floor { fill: #FFF3E0; }
.maze-wall { stroke: #5B4636; stroke-width: 3; stroke-linecap: round; }
.maze-cell-hit { fill: transparent; cursor: pointer; }
.maze-player { fill: #FF6B6B; }
.maze-goal { fill: #4ECDC4; }
.maze-tip { text-align: center; font-size: 18px; color: var(--text-light); margin: 16px 8px 6px; }
.maze-next { display: block; margin: 8px auto 0; font-family: var(--font); font-size: 20px; padding: 12px 32px; border: none; border-radius: 40px; background: var(--teal); color: #fff; cursor: pointer; box-shadow: var(--shadow); }
.maze-next:active { transform: scale(0.96); }

.tangram-container { padding: 16px; max-width: 520px; margin: 0 auto; }
.tangram-diff { display: flex; justify-content: center; gap: 10px; margin: 14px 0 10px; flex-wrap: wrap; align-items: center; }
.tangram-diff-btn { font-family: var(--font); font-size: 18px; padding: 10px 18px; border: 2px solid #A78BFA; background: #fff; color: #A78BFA; border-radius: 40px; cursor: pointer; box-shadow: var(--shadow); }
.tangram-diff-btn.active { background: #A78BFA; color: #fff; }
.tangram-diff-btn:active { transform: scale(0.95); }
.tangram-reshuffle-btn { font-family: var(--font); font-size: 22px; padding: 10px 14px; border: 2px solid #FF9F45; background: #FFF7E6; color: #FF9F45; border-radius: 40px; cursor: pointer; box-shadow: var(--shadow); transition: transform 0.3s; }
.tangram-reshuffle-btn:hover { transform: rotate(180deg); background: #FFE8C2; }
.tangram-board { display: flex; justify-content: center; touch-action: none; margin-top: 4px; }
.tangram-svg { width: 100%; max-width: 400px; height: auto; background: #fff; border-radius: 16px; box-shadow: var(--shadow); user-select: none; -webkit-user-select: none; }
.tangram-target { fill: rgba(167,139,250,0.05); stroke: #C4B5FD; stroke-width: 2; stroke-dasharray: 6 5; stroke-linecap: round; }
.tangram-piece { stroke: rgba(0,0,0,0.25); stroke-width: 1.5; cursor: grab; transition: opacity 0.2s; }
.tangram-piece:active { cursor: grabbing; }
.tangram-piece.placed { stroke: rgba(0,0,0,0.4); stroke-width: 2; }
.tangram-tip { text-align: center; font-size: 18px; color: var(--text-light); margin: 12px 8px 6px; }
.tangram-next { display: block; margin: 8px auto 0; font-family: var(--font); font-size: 20px; padding: 12px 32px; border: none; border-radius: 40px; background: #A78BFA; color: #fff; cursor: pointer; box-shadow: var(--shadow); }
.tangram-next:active { transform: scale(0.96); }
.clock-svg { display: block; margin: 4px auto 10px; max-width: 220px; width: 60%; height: auto; }
.clock-svg-drag { touch-action: none; cursor: grab; max-width: 240px; width: 70%; }
.clock-svg-drag:active { cursor: grabbing; }
.clock-target { text-align: center; font-size: 26px; font-weight: 700; color: var(--text); margin: 6px 0 2px; }
.clock-target b { color: #38BDF8; }
.clock-drag-hint { text-align: center; font-size: 15px; color: #999; margin-bottom: 6px; }

/* ---- 绘本（单词书 · 模式A） ---- */
.books-container { padding: 16px; max-width: 720px; margin: 0 auto; }
.books-shelf { display: flex; flex-direction: column; gap: 24px; margin-top: 12px; }
.book-group-title { font-size: 22px; font-weight: 700; color: var(--text); padding-left: 4px; margin-bottom: 2px; }
.book-group-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; }
.book-card { background: var(--white); border: 3px solid #FB7185; border-radius: var(--radius); padding: 20px 12px; text-align: center; cursor: pointer; box-shadow: var(--shadow); transition: transform .2s; position: relative; }
.book-card:active { transform: scale(0.95); }
.book-card .book-emoji { font-size: 44px; }
.book-card .book-title { font-size: 20px; font-weight: 600; color: #FB7185; margin-top: 6px; }
.book-card .book-count { font-size: 13px; color: var(--text-light); margin-top: 4px; }
.book-card .book-done { position: absolute; top: 8px; right: 10px; font-size: 18px; }
.book-cat-back { display: inline-block; font-size: 17px; color: var(--text-light); background: var(--white); border: 2px solid #e5e7eb; border-radius: 30px; padding: 8px 18px; margin-bottom: 14px; cursor: pointer; }
.book-cat-back:active { transform: scale(0.96); }
.reader-container { padding: 16px; max-width: 720px; margin: 0 auto; }
.reader-page { text-align: center; padding: 30px 10px; min-height: 44vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.reader-emoji { font-size: 140px; line-height: 1; margin-bottom: 18px; }
.reader-word { font-size: 40px; font-weight: 700; color: var(--text); letter-spacing: 1px; margin-bottom: 22px; }
.reader-sentence { font-size: 34px; font-weight: 700; color: var(--text); letter-spacing: 0.5px; line-height: 1.4; margin-bottom: 8px; max-width: 92%; text-align: center; }
.reader-cn { font-size: 22px; color: var(--text-light); line-height: 1.5; margin-bottom: 22px; max-width: 92%; text-align: center; }
.reader-listen { font-size: 22px; padding: 14px 30px; border: none; border-radius: 40px; background: #FB7185; color: #fff; cursor: pointer; box-shadow: var(--shadow); }
.reader-listen:active { transform: scale(0.96); }
.reader-counter { margin-top: 22px; font-size: 16px; color: var(--text-light); }
.reader-nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 18px; }
.reader-btn { flex: 1; font-size: 20px; padding: 14px; border: 2px solid #FB7185; border-radius: 16px; background: var(--white); color: #FB7185; cursor: pointer; }
.reader-btn:active { transform: scale(0.97); }
.reader-btn:disabled { opacity: .4; cursor: default; }
.reader-finish { text-align: center; padding: 30px 16px; }
.reader-finish .finish-emoji { font-size: 90px; }
.reader-finish .finish-text { font-size: 24px; font-weight: 600; margin: 16px 0; color: var(--text); }

/* ---- Quiz Page ---- */
.quiz-container {
  flex: 1;
  display: flex; flex-direction: column; gap: 16px;
}

.quiz-header {
  display: flex; align-items: center; gap: 12px;
}
.back-btn {
  background: var(--white); border: none;
  width: 44px; height: 44px; border-radius: 50%;
  font-size: 22px; cursor: pointer;
  box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: center;
}
.quiz-title { font-size: 22px; font-weight: 600; }
.replay-btn {
  margin-left: auto;
  background: var(--white); border: none;
  width: 44px; height: 44px; border-radius: 50%;
  font-size: 22px; cursor: pointer;
  box-shadow: var(--shadow);
  display: flex; align-items: center; justify-content: center;
}

.progress-wrap {
  background: #eee; border-radius: 50px; height: 12px; overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 50px;
  background: linear-gradient(90deg, var(--teal), var(--coral));
  transition: width 0.4s ease;
}

.question-area {
  background: var(--white);
  border-radius: var(--radius);
  padding: 40px 20px;
  text-align: center;
  box-shadow: var(--shadow);
  min-height: 200px;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px;
}

.question-label {
  font-size: 18px; color: var(--text-light);
}
.question-emoji {
  font-size: 72px; line-height: 1.2;
}
.question-text {
  font-size: 48px; font-weight: 700; color: var(--coral);
}

.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.option-btn {
  background: var(--white);
  border: 3px solid #eee;
  border-radius: var(--radius);
  padding: 20px 12px;
  font-size: 28px; font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  box-shadow: var(--shadow);
  font-family: var(--font);
  min-height: 80px;
  display: flex; align-items: center; justify-content: center;
}
.option-btn:active { transform: scale(0.95); }
.option-btn.correct {
  border-color: var(--teal);
  background: var(--teal-pale);
  animation: popIn 0.4s ease;
}
.option-btn.wrong {
  border-color: var(--coral);
  background: var(--coral-pale);
  animation: shake 0.5s ease;
}
.option-btn:disabled { pointer-events: none; opacity: 0.7; }

/* ---- Memory Game ---- */
.memory-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  padding: 8px;
}
.memory-card {
  aspect-ratio: 1;
  background: linear-gradient(135deg, var(--teal-light), var(--teal));
  border: none;
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  font-size: 36px;
  cursor: pointer;
  transition: transform 0.2s, background 0.3s;
  display: flex; align-items: center; justify-content: center;
  min-height: 90px;
}
.memory-card:active { transform: scale(0.95); }
.memory-card.flipped {
  background: var(--white);
  border: 3px solid var(--teal);
}
.memory-card.matched {
  background: var(--teal-pale);
  border-color: var(--teal);
  opacity: 0.8;
  cursor: default;
}
.memory-card .card-face {
  display: none;
}
.memory-card.flipped .card-face,
.memory-card.matched .card-face {
  display: block;
}
.memory-card .card-back {
  display: block;
  font-size: 28px;
  color: var(--white);
}
.memory-card.flipped .card-back,
.memory-card.matched .card-back {
  display: none;
}
.memory-info {
  text-align: center;
  font-size: 18px;
  color: var(--text-light);
  margin-bottom: 8px;
}
@keyframes popIn {
  0% { transform: scale(0.8); opacity: 0.5; }
  60% { transform: scale(1.08); }
  100% { transform: scale(1); opacity: 1; }
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}
@keyframes starFly {
  0% { transform: scale(1) translateY(0); opacity: 1; }
  100% { transform: scale(0.5) translateY(-60px); opacity: 0; }
}

.feedback-overlay {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none; z-index: 100;
}
.feedback-text {
  font-size: 40px; font-weight: 700; opacity: 0;
  animation: feedbackPop 1.2s ease forwards;
  text-shadow: 0 2px 12px rgba(0,0,0,0.08);
}
@keyframes feedbackPop {
  0% { opacity:0; transform: translateY(20px) scale(0.5); }
  30% { opacity:1; transform: translateY(0) scale(1.1); }
  50% { transform: translateY(0) scale(1); }
  100% { opacity:0; transform: translateY(-30px) scale(0.8); }
}

/* === 反馈动画系统（新增）=== */
.fb-medal {
  position: fixed; left: 50%; top: 45%;
  width: 120px; height: 120px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 48px; z-index: 200; pointer-events: none;
  box-shadow: 0 8px 30px rgba(0,0,0,0.18);
  animation: medalPop 0.5s ease forwards;
}
@keyframes medalPop {
  0%   { transform: translate(-50%,-50%) scale(0); }
  60%  { transform: translate(-50%,-50%) scale(1.2); }
  100% { transform: translate(-50%,-50%) scale(1); }
}

.fb-bg-flash {
  position: fixed; inset: 0; background: #FFD700; opacity: 0.3;
  z-index: 150; pointer-events: none; animation: bgFlash 0.3s ease forwards;
}
@keyframes bgFlash {
  0%   { opacity: 0.3; }
  100% { opacity: 0; }
}

.fb-particle {
  position: fixed; z-index: 160; pointer-events: none;
  animation-name: particleFall; animation-timing-function: ease-in;
  animation-fill-mode: forwards; will-change: transform, opacity;
}
@keyframes particleFall {
  0%   { transform: translate(0,0) rotate(0deg); opacity: 1; }
  100% { transform: translate(var(--drift,0), 110vh) rotate(360deg); opacity: 0; }
}

.fb-combo {
  position: fixed; left: 50%; top: 62%; transform: translateX(-50%);
  font-size: 24px; font-weight: 700; z-index: 200; pointer-events: none;
  color: #FF6B6B; text-shadow: 0 2px 8px rgba(0,0,0,0.12);
  animation: comboSlide 1.5s ease forwards;
}
@keyframes comboSlide {
  0%   { opacity: 0; transform: translateX(-50%) translateY(30px); }
  20%  { opacity: 1; transform: translateX(-50%) translateY(0); }
  80%  { opacity: 1; }
  100% { opacity: 0; }
}

.fb-wrong {
  position: fixed; left: 50%; top: 45%; transform: translate(-50%,-50%);
  z-index: 200; pointer-events: none; display: flex; flex-direction: column;
  align-items: center; gap: 12px; animation: wrongPop 2s ease forwards;
}
.fb-wrong-circle {

}
.fb-wrong-text { font-size: 20px; color: #4A90D9; font-weight: 600; }

  0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.6); }
  15%  { opacity: 1; transform: translate(-50%,-50%) scale(1); }
  85%  { opacity: 1; }
  100% { opacity: 0; }
}

.option-btn.fb-blink { animation: correctBlink 0.3s ease; }
@keyframes correctBlink {
  0%, 100% { box-shadow: 0 0 0 0 rgba(76,175,80,0); background: transparent; }

.fb-fly-star {

.fb-counter-bump { animation: counterBump 0.3s ease; }
@keyframes counterBump {
  0%   { transform: scale(1); }
  50%  { transform: scale(1.4); }
  100% { transform: scale(1); }
}
.fb-counter-gold { animation: counterGold 0.3s ease; }
@keyframes counterGold {
  0%   { color: inherit; }
  50%  { color: #FFD700; }
  100% { color: inherit; }
}

.fb-achievement {
  position: fixed; left: 50%; top: 40%; transform: translate(-50%,-50%);

  color: #FFD700; text-shadow: 0 4px 16px rgba(0,0,0,0.2);
  animation: achievementPop 1.5s ease forwards;

@keyframes achievementPop {
  0%   { opacity: 0; transform: translate(-50%,-50%) scale(0.5); }
  20%  { opacity: 1; transform: translate(-50%,-50%) scale(1.1); }
  40%  { transform: translate(-50%,-50%) scale(1); }

function loadData() {

    const parsed = JSON.parse(raw);
    if (!parsed.quizBank) parsed.quizBank = defaultData().quizBank;
    if (!parsed.childName) parsed.childName = '宝宝';
    if (typeof parsed.stars !== 'number') parsed.stars = 0;
    if (typeof parsed.soundEnabled !== 'boolean') parsed.soundEnabled = true;
    if (typeof parsed.ttsEnabled !== 'boolean') parsed.ttsEnabled = true;
    if (!parsed.quizBank.characters) parsed.quizBank.characters = defaultData().quizBank.characters;
    if (!parsed.quizBank.pinyin) parsed.quizBank.pinyin = defaultData().quizBank.pinyin;
    if (!parsed.quizBank.english) parsed.quizBank.english = defaultData().quizBank.english;
    if (!parsed.booksFinished || typeof parsed.booksFinished !== 'object') parsed.booksFinished = {};
    return parsed;
  } catch(e) {
    return defaultData();
  }
}

/* 星星飞入顶部计数器（沿弧线，Web Animations API 原生实现） */
function flyStarToCounter() {
  const star = document.createElement('div');
  star.className = 'fb-fly-star';
  star.textContent = '⭐';
  const startX = window.innerWidth / 2;
  const startY = window.innerHeight / 2;
  const badge = document.querySelector('.star-badge');
  const rect = badge.getBoundingClientRect();
  const endX = rect.left + rect.width / 2;
  const endY = rect.top + rect.height / 2;
  const dx = endX - startX, dy = endY - startY;
  const midX = startX + dx * 0.5;
  const midY = Math.min(startY, endY) - 120;
  star.style.left = startX + 'px';
  star.style.top = startY + 'px';
  document.body.appendChild(star);
  const anim = star.animate([
    { transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
    { transform: 'translate(' + (midX - startX) + 'px,' + (midY - startY) + 'px) scale(1.1)', opacity: 1, offset: 0.5 },
    { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(0.4)', opacity: 0.2 }
  ], { duration: 600, easing: 'ease-in-out' });
  anim.onfinish = () => { star.remove(); bumpCounter(); };
}

/* ========== AUDIO ========== */

let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
}

function playTone(freq, type, duration, startTime, vol) {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  osc.connect(gain);
  gain.connect(audioCtx.destination);
  osc.start(startTime);
  gain.gain.setValueAtTime(vol || 0.25, startTime);
  gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
  osc.stop(startTime + duration);
}

function playCorrectSound() {
  if (!appData.soundEnabled) return;
  initAudio();
  const now = audioCtx.currentTime;
  playTone(523.25, 'sine', 0.18, now, 0.25);      // C5
  playTone(659.25, 'sine', 0.18, now + 0.12, 0.25); // E5
  playTone(783.99, 'sine', 0.30, now + 0.24, 0.30); // G5
}

function playWrongSound() {
  if (!appData.soundEnabled) return;
  initAudio();
  const now = audioCtx.currentTime;
  playTone(220.00, 'triangle', 0.25, now, 0.25);      // A3
  playTone(196.00, 'triangle', 0.35, now + 0.25, 0.25); // G3
}

/* ========== TTS 语音朗读 ========== */
let currentSpeakText = '';
const ttsSupported = ('speechSynthesis' in window);
let ttsVoices = [];
let ttsReady = false;   // iOS 需要首次在用户手势内激活语音引擎
function loadTtsVoices() {
  if (!ttsSupported) return;
  try { ttsVoices = window.speechSynthesis.getVoices() || []; } catch(e) { ttsVoices = []; }
}
if (ttsSupported) {
  loadTtsVoices();
  try { window.speechSynthesis.onvoiceschanged = loadTtsVoices; } catch(e) {}
}
// 预热：在用户手势内先播一个静音空句，解锁 iOS 语音引擎
function warmUpTts() {
  if (!ttsSupported || ttsReady) return;
  try {
    const u = new SpeechSynthesisUtterance('');
    u.volume = 0;
    window.speechSynthesis.speak(u);
    ttsReady = true;
  } catch(e) {}
}
// 首次任意交互即解锁（点击模块卡片时也会触发，确保在读题前激活）
if (ttsSupported) {
  ['touchstart', 'click'].forEach(function(ev) {
    window.addEventListener(ev, warmUpTts, { once: true, passive: true });
  });
}
function speak(text) {
  if (!appData.ttsEnabled || !ttsSupported || !text) return;
  try {
    if (!ttsVoices.length) loadTtsVoices();   // 刷新 voices（iOS 异步加载）
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'zh-CN';
    u.rate = 0.9;
    u.pitch = 1.1;
    const zh = ttsVoices.find(function(v){ return /^zh/i.test(v.lang || ''); }) ||
               ttsVoices.find(function(v){ return /chinese|中文|普通话/i.test(v.name || ''); });
    if (zh) u.voice = zh;
    if (!ttsReady) warmUpTts();               // 首次先解锁引擎
    window.speechSynthesis.cancel();
    // iOS: cancel 后立即 speak 会静默，延迟一点再播
    setTimeout(function() {
      try { window.speechSynthesis.speak(u); } catch(e) {}
    }, ttsReady ? 60 : 120);
  } catch(e) {}
}

    u.rate = 0.85;   // 放慢一点，适合幼儿听清
    u.pitch = 1.0;
    const en = ttsVoices.find(function(v){ return /^en/i.test(v.lang || ''); }) ||
               ttsVoices.find(function(v){ return /english|english|英/i.test(v.name || ''); });
    if (en) u.voice = en;
    if (!ttsReady) warmUpTts();               // 首次先解锁引擎
    window.speechSynthesis.cancel();
    // iOS: cancel 后立即 speak 会静默，延迟一点再播
    setTimeout(function() {
      try { window.speechSynthesis.speak(u); } catch(e) {}
    }, ttsReady ? 60 : 120);
  } catch(e) {}
}

/* ========== CONFETTI ========== */

const confettiCanvas = $('#confetti');
const ctx = confettiCanvas.getContext('2d');
let confettiParticles = [];
let confettiAnimId = null;

function resizeConfetti() {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeConfetti);
resizeConfetti();

function spawnConfetti() {
  const colors = ['#FF6B6B','#4ECDC4','#FFE66D','#A78BFA','#F59E0B','#FF8E8E','#6FE0DB'];
  for (let i = 0; i < 60; i++) {
    confettiParticles.push({
      x: Math.random() * confettiCanvas.width,
      y: -10 - Math.random() * 40,
      w: 6 + Math.random() * 10,
      h: 4 + Math.random() * 8,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 4,
      vy: 2 + Math.random() * 5,
      rotation: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 10,
      opacity: 1
    });
  }
  if (!confettiAnimId) {
    function animate() {
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      let alive = false;
      for (let i = confettiParticles.length - 1; i >= 0; i--) {
        const p = confettiParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.08;
        p.rotation += p.rotSpeed;
        p.opacity -= 0.008;
        if (p.opacity <= 0 || p.y > confettiCanvas.height + 20) {
          confettiParticles.splice(i, 1);
        } else {
          alive = true;
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rotation * Math.PI / 180);
          ctx.globalAlpha = p.opacity;
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
          ctx.restore();
        }
      }
      if (alive) { confettiAnimId = requestAnimationFrame(animate); }
      else { confettiAnimId = null; confettiParticles = []; ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height); }
    }
    confettiAnimId = requestAnimationFrame(animate);
  }
}

function stopConfetti() {
  if (confettiAnimId) {
    cancelAnimationFrame(confettiAnimId);
    confettiAnimId = null;
  }
  confettiParticles = [];
  ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
}

/* ========== QUIZ ENGINE ========== */

let quizState = null;

function generateCountingQuestions() {
  const emojis = ['🍎','🍊','🍋','🍇','🍓','🌸','⭐','🐱','🐶','🐰','🐟','🦋','🌺','🍭','🎈'];
  const questions = [];
  /* 前 6 题：数一数；后 4 题：比一比 */
  for (let i = 0; i < 10; i++) {
    if (i < 6) {
      /* ---- 数一数 ---- */
      const count = 1 + Math.floor(Math.random() * 10);
      const emoji = emojis[Math.floor(Math.random() * emojis.length)];
      const correct = String(count);
      const opts = new Set([correct]);
      let safety = 0;
      while (opts.size < 4 && safety < 100) {
        safety++;
        const cand = String(1 + Math.floor(Math.random() * 10));
        opts.add(cand);
      }
      const shuffledOpts = shuffle([...opts]);
      questions.push({ type:'count', count, emoji, options: shuffledOpts, correct });
    } else {
      /* ---- 比一比 ---- */
      const leftCount = 2 + Math.floor(Math.random() * 9);    /* 2~10 */
      const rightCount = 2 + Math.floor(Math.random() * 9);   /* 2~10 */
      /* 避免左右完全相等几率太高：若相等则调整一侧 */
      const adjustedRight = rightCount === leftCount
        ? (leftCount >= 6 ? leftCount - 1 : leftCount + 1)
        : rightCount;
      const leftEmoji = emojis[Math.floor(Math.random() * emojis.length)];
      let rightEmoji = emojis[Math.floor(Math.random() * emojis.length)];
      while (rightEmoji === leftEmoji) rightEmoji = emojis[Math.floor(Math.random() * emojis.length)];
      /* 随机问"哪边多" 或 "哪边少" */
      const askMore = Math.random() > 0.5;
      const largerSide = leftCount > adjustedRight ? 'left' : 'right';
      const smallerSide = leftCount > adjustedRight ? 'right' : 'left';
      const answer = askMore ? largerSide : smallerSide;
      const allOpts = shuffle(['left', 'right']);
      /* 4 个选项：正确 + 另一边 + "一样多" + "😅" */
      const labels = {
        left: '左边更多',
        right: '右边更多'
      };
      if (askMore) {
        labels.left = '左边更多';
        labels.right = '右边更多';
      } else {
        labels.left = '左边更少';
        labels.right = '右边更少';
      }
      const options = [
        labels[answer],
        labels[answer === 'left' ? 'right' : 'left'],
        leftCount === adjustedRight ? '一样多' : (askMore ? '一样多' : '一样多'),
        '😅 不知道'
      ];
      const correct = labels[answer];
      questions.push({
        type: 'compare',
        left: { count: leftCount, emoji: leftEmoji },
        right: { count: adjustedRight, emoji: rightEmoji },
        question: askMore ? '哪边更多？' : '哪边更少？',
        options,
        correct
      });
    }
  }
  return questions;
}

function generateMathQuestions(maxNum) {
  maxNum = maxNum || 10;
  const questions = [];
  for (let i = 0; i < 10; i++) {
    const isAdd = Math.random() > 0.5;
    let a, b, answer, question;
    if (isAdd) {
      answer = 2 + Math.floor(Math.random() * (maxNum - 1));
      a = 1 + Math.floor(Math.random() * (answer - 1));
      b = answer - a;
      question = a + ' + ' + b + ' = ?';
    } else {
      a = 2 + Math.floor(Math.random() * (maxNum - 1));
      b = 1 + Math.floor(Math.random() * a);
      answer = a - b;
      question = a + ' - ' + b + ' = ?';
    }
    const correct = String(answer);
    const opts = new Set([correct]);
    let safety = 0;
    while (opts.size < 4 && safety < 100) {
      safety++;
      const cand = String(Math.floor(Math.random() * (maxNum + 1)));
      opts.add(cand);
    }
    const shuffledOpts = shuffle([...opts]);
    questions.push({ question, options: shuffledOpts, correct });
  }
  return questions;
}

function generatePatternQuestions() {
  const allEmojis = ['🍎','🍊','🍋','🍇','🍓','🍉','🍌','🍒','🥝','🍑','🥕','🌽','🍄','🌰','🍪'];
  const patterns = ['ABAB', 'AAB', 'ABB', 'ABC'];
  const questions = [];
  for (let i = 0; i < 10; i++) {
    const type = patterns[Math.floor(Math.random() * patterns.length)];
    const pool = shuffle([...allEmojis]).slice(0, 3);
    const A = pool[0], B = pool[1], C = pool[2];
    let sequence = [];
    if (type === 'ABAB') {
      sequence = [A, B, A, B, A, null];
    } else if (type === 'AAB') {
      sequence = [A, A, B, A, A, null];
    } else if (type === 'ABB') {
      sequence = [A, B, B, A, B, null];
    } else if (type === 'ABC') {
      sequence = [A, B, C, A, B, null];
    }
    const correct = sequence[sequence.length - 1] || (type === 'ABC' ? C : (type === 'ABAB' || type === 'ABB' ? B : B));
    const shownSequence = sequence.slice(0, -1);
    const opts = new Set([correct]);
    let safety = 0;
    while (opts.size < 4 && safety < 100) {
      safety++;
      opts.add(allEmojis[Math.floor(Math.random() * allEmojis.length)]);
    }
    questions.push({
      type: 'pattern',
      sequence: shownSequence,
      patternType: type,
      options: shuffle([...opts]),
      correct
    });
  }
  return questions;
}

function generateClassificationQuestions() {
  const categories = [
    { name: '水果', items: ['🍎','🍊','🍇','🍓','🍌','🍉','🍒','🍑'] },
    { name: '动物', items: ['🐱','🐶','🐰','🐼','🐯','🦁','🐷','🐸'] },
    { name: '交通工具', items: ['🚗','🚌','🚕','🚓','🚑','🚒','🚜','🚲'] },
    { name: '食物', items: ['🍚','🍜','🍔','🍕','🍰','🍩','🍪','🍫'] },
    { name: '文具', items: ['✏️','🖍️','📏','✂️','🎒','📐','📝','📘'] },
    { name: '衣服', items: ['👕','👖','👗','👔','🧦','🧥','🧢','👟'] },
    { name: '运动', items: ['⚽','🏀','🏐','⚾','🎾','🏓','🏸','🏒'] },
    { name: '家具', items: ['🛏️','🪑','🚪','🪟','🛋️','🚽','🪞','🧺'] }
  ];
  const questions = [];
  for (let i = 0; i < 10; i++) {
    const mainIdx = Math.floor(Math.random() * categories.length);
    let oddIdx = Math.floor(Math.random() * categories.length);
    while (oddIdx === mainIdx) oddIdx = Math.floor(Math.random() * categories.length);
    const mainCat = categories[mainIdx];
    const oddCat = categories[oddIdx];
    const mainItems = shuffle([...mainCat.items]).slice(0, 3);
    const oddItem = oddCat.items[Math.floor(Math.random() * oddCat.items.length)];
    const allItems = shuffle([...mainItems, oddItem]);
    questions.push({
      type: 'classify',
      items: allItems,
      mainCategory: mainCat.name,
      options: allItems,
      correct: oddItem
    });
  }
  return questions;
}

/* ========== CLOCK (认识钟表) ========== */

function timeToChinese(hour, minute) {
  const h = ((hour % 12) === 0) ? 12 : (hour % 12);
  if (minute === 0) return h + '点整';
  if (minute === 30) return h + '点半';
  if (minute === 15) return h + '点一刻';
  if (minute === 45) return h + '点三刻';
  return h + '点' + minute + '分';
}

function drawClockSVG(hour, minute) {
  const cx = 100, cy = 100, r = 90;
  let ticks = '';
  for (let i = 1; i <= 12; i++) {
    const ang = (i * 30 - 90) * Math.PI / 180;
    const x1 = (cx + r * Math.cos(ang)).toFixed(1);
    const y1 = (cy + r * Math.sin(ang)).toFixed(1);
    const x2 = (cx + (r - 12) * Math.cos(ang)).toFixed(1);
    const y2 = (cy + (r - 12) * Math.sin(ang)).toFixed(1);
    ticks += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="#cbd5e1" stroke-width="2"/>';
  }
  let nums = '';
  for (let i = 1; i <= 12; i++) {
    const ang = (i * 30 - 90) * Math.PI / 180;
    const nx = (cx + (r - 26) * Math.cos(ang)).toFixed(1);
    const ny = (cy + (r - 26) * Math.sin(ang) + 5).toFixed(1);
    nums += '<text x="' + nx + '" y="' + ny + '" text-anchor="middle" font-size="14" fill="#555">' + i + '</text>';
  }
  const hourAng = ((hour % 12) * 30 + minute * 0.5 - 90) * Math.PI / 180;
  const minAng = (minute * 6 - 90) * Math.PI / 180;
  const hx = (cx + 46 * Math.cos(hourAng)).toFixed(1);
  const hy = (cy + 46 * Math.sin(hourAng)).toFixed(1);
  const mx = (cx + 70 * Math.cos(minAng)).toFixed(1);
  const my = (cy + 70 * Math.sin(minAng)).toFixed(1);
  return '<svg width="200" height="200" viewBox="0 0 200 200" class="clock-svg">' +
    '<circle cx="100" cy="100" r="93" fill="#fff" stroke="#FF6B6B" stroke-width="5"/>' +
    ticks + nums +
    '<line x1="100" y1="100" x2="' + hx + '" y2="' + hy + '" stroke="#333" stroke-width="6" stroke-linecap="round"/>' +
    '<line x1="100" y1="100" x2="' + mx + '" y2="' + my + '" stroke="#4ECDC4" stroke-width="4" stroke-linecap="round"/>' +
    '<circle cx="100" cy="100" r="6" fill="#333"/>' +
    '</svg>';
}

function generateClockQuestions(advanced) {
  const questions = [];
  const fmt = function(h, m) { return h + ':' + String(m).padStart(2, '0'); };
  for (let i = 0; i < 10; i++) {
    const hour = 1 + Math.floor(Math.random() * 12);
    let minute;
    if (advanced) {
      minute = 5 * Math.floor(Math.random() * 12); // 任意5分钟：0,5,...,55
    } else {
      minute = Math.random() < 0.5 ? 0 : 30;
    }
    const correct = fmt(hour, minute);
    const opts = new Set([correct]);
    let safety = 0;
    while (opts.size < 4 && safety < 100) {
      safety++;
      const h2 = 1 + Math.floor(Math.random() * 12);
      const m2 = advanced ? (5 * Math.floor(Math.random() * 12)) : (Math.random() < 0.5 ? 0 : 30);
      opts.add(fmt(h2, m2));
    }
    const options = shuffle(Array.from(opts));
    questions.push({ hour, minute, options, correct });
  }
  return questions;
}

function nextClockDragRound() {

  if (clockDragState.round >= clockDragState.total) {
    quizState = { module: 'clock', questions: new Array(clockDragState.total).fill(null), currentIndex: 0, score: clockDragState.score, answered: false, firstTry: true, wrongAttempts: 0 };

  }

  clockDragState.setMinute = 0;
  clockDragState.attempts = 0;
  clockDragState.answered = false;

function renderClockDrag() {
  const t = clockDragState.target;

    '<div class="clock-target">请拨出：🕐 <b>' + t.hour + ':' + String(t.minute).padStart(2, '0') + '</b></div>' +

    '<button class="option-btn" id="clockConfirmBtn" data-clock-act>✅ 确认</button>';
  const svg = questionArea.querySelector('#clockDragSvg');

  document.getElementById('clockSpeakBtn').addEventListener('click', function () {
    speak(timeToChinese(clockDragState.target.hour, clockDragState.target.minute));
  });
  document.getElementById('clockConfirmBtn').addEventListener('click', clockConfirm);
  updateClockDragHands(svg);
}

function drawClockDragSVG() {
  const cx = 100, cy = 100, r = 90;
  let ticks = '';
  for (let i = 1; i <= 12; i++) {
    const ang = (i * 30 - 90) * Math.PI / 180;
    ticks += '<line x1="' + (cx + r * Math.cos(ang)).toFixed(1) + '" y1="' + (cy + r * Math.sin(ang)).toFixed(1) +
             '" x2="' + (cx + (r - 12) * Math.cos(ang)).toFixed(1) + '" y2="' + (cy + (r - 12) * Math.sin(ang)).toFixed(1) +
             '" stroke="#cbd5e1" stroke-width="2"/>';
  }
  let nums = '';
  for (let i = 1; i <= 12; i++) {
    const ang = (i * 30 - 90) * Math.PI / 180;
    nums += '<text x="' + (cx + (r - 26) * Math.cos(ang)).toFixed(1) + '" y="' + (cy + (r - 26) * Math.sin(ang) + 5).toFixed(1) +
            '" text-anchor="middle" font-size="14" fill="#555">' + i + '</text>';
  }
  return '<svg id="clockDragSvg" width="200" height="200" viewBox="0 0 200 200" class="clock-svg clock-svg-drag">' +
    '<circle cx="100" cy="100" r="93" fill="#fff" stroke="#FF6B6B" stroke-width="5"/>' +
    ticks + nums +
    '<line id="hourHand" x1="100" y1="100" x2="100" y2="60" stroke="#333" stroke-width="6" stroke-linecap="round"/>' +
    '<line id="minHand" x1="100" y1="100" x2="100" y2="35" stroke="#4ECDC4" stroke-width="4" stroke-linecap="round"/>' +
    '<circle id="hourTip" cx="100" cy="60" r="8" fill="#333"/>' +
    '<circle id="minTip" cx="100" cy="35" r="7" fill="#4ECDC4"/>' +
    '<circle cx="100" cy="100" r="6" fill="#333"/>' +
    '</svg>';
}

function updateClockDragHands(svg) {
  const H = clockDragState.setHour, M = clockDragState.setMinute;
  const hourAng = (H % 12 * 30 - 90) * Math.PI / 180;
  const minAng = (M * 6 - 90) * Math.PI / 180;
  const hx = (100 + 46 * Math.cos(hourAng)).toFixed(1), hy = (100 + 46 * Math.sin(hourAng)).toFixed(1);
  const mx = (100 + 70 * Math.cos(minAng)).toFixed(1), my = (100 + 70 * Math.sin(minAng)).toFixed(1);
  svg.querySelector('#hourHand').setAttribute('x2', hx); svg.querySelector('#hourHand').setAttribute('y2', hy);
  svg.querySelector('#minHand').setAttribute('x2', mx); svg.querySelector('#minHand').setAttribute('y2', my);
  svg.querySelector('#hourTip').setAttribute('cx', hx); svg.querySelector('#hourTip').setAttribute('cy', hy);
  svg.querySelector('#minTip').setAttribute('cx', mx); svg.querySelector('#minTip').setAttribute('cy', my);
}

function wireClockDrag(svg) {
  function angleFromEvent(e) {
    const rect = svg.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (200 / rect.width) - 100;
    const y = (e.clientY - rect.top) * (200 / rect.height) - 100;
    let ang = Math.atan2(y, x) * 180 / Math.PI + 90;
    return ((ang % 360) + 360) % 360;
  }
  function applyAngle(ang) {
    if (clockDragState.activeHand === 'min') {
      clockDragState.setMinute = Math.round(ang / 30) * 5 % 60;
    } else {
      let h = Math.round(ang / 30) % 12;
      if (h === 0) h = 12;
      clockDragState.setHour = h;
    }
    updateClockDragHands(svg);
  }
  svg.addEventListener('pointerdown', function (e) {
    if (clockDragState.answered) return;
    const rect = svg.getBoundingClientRect();
    const px = (e.clientX - rect.left) * (200 / rect.width) - 100;
    const py = (e.clientY - rect.top) * (200 / rect.height) - 100;
    const ha = (clockDragState.setHour % 12 * 30 - 90) * Math.PI / 180;
    const ma = (clockDragState.setMinute * 6 - 90) * Math.PI / 180;
    const hTip = { x: 100 + 46 * Math.cos(ha), y: 100 + 46 * Math.sin(ha) };
    const mTip = { x: 100 + 70 * Math.cos(ma), y: 100 + 70 * Math.sin(ma) };
    const dH = Math.hypot(px - hTip.x, py - hTip.y);
    const dM = Math.hypot(px - mTip.x, py - mTip.y);
    clockDragState.activeHand = dM <= dH ? 'min' : 'hour';
    applyAngle(angleFromEvent(e));
    try { svg.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  svg.addEventListener('pointermove', function (e) {
    if (!clockDragState.activeHand || clockDragState.answered) return;
    applyAngle(angleFromEvent(e));
  });
  svg.addEventListener('pointerup', function () { clockDragState.activeHand = null; });
  svg.addEventListener('pointercancel', function () { clockDragState.activeHand = null; });
}

function clockConfirm() {
  if (!clockDragState || clockDragState.answered) return;
  const setH = ((clockDragState.setHour % 12) === 0) ? 12 : clockDragState.setHour;
  const t = clockDragState.target;
  const btn = document.getElementById('clockConfirmBtn');
  if (setH === t.hour && clockDragState.setMinute === t.minute) {
    clockDragState.answered = true;
    clockDragState.score++;
    appData.stars++;
    saveData(appData);
    refreshHeader();
    spawnConfetti();
    onCorrectAnswer(btn, true);
    setTimeout(nextClockDragRound, 1500);
  } else {
    clockDragState.attempts++;
    const isFinal = clockDragState.attempts >= 3;
    onWrongAnswer(null, isFinal);
    if (isFinal) {
      clockDragState.setHour = t.hour;
      clockDragState.setMinute = t.minute;
      updateClockDragHands(questionArea.querySelector('#clockDragSvg'));
      setTimeout(nextClockDragRound, 2000);
    }
  }
}

function startQuiz(module) {
  if (!module || !['characters','pinyin','counting','math','pattern','classify','memory','english','clock'].includes(module)) {
    console.error('Invalid module:', module);
    return;
  }
  stopConfetti();
  comboCount = 0;

  if (module === 'math') {
    showMathDifficultyPicker();
    return;
  }

  if (module === 'memory') {
    startMemoryGame();
    return;
  }

  if (module === 'clock') {
    showClockModePicker();
    return;
  }

  const titles = {
    characters:'📖 识字',
    pinyin:'🔤 拼音',
    counting:'🔢 数数',

  };
  quizTitle.textContent = titles[module];

  let questions;
  if (module === 'counting') {
    questions = generateCountingQuestions();
  } else if (module === 'pattern') {
    questions = generatePatternQuestions();
  } else if (module === 'classify') {
    questions = generateClassificationQuestions();
  } else if (module === 'clock') {
    questions = generateClockQuestions();
  } else {
    const bank = appData.quizBank[module];
    const picked = shuffle(bank).slice(0, 10);
    questions = picked.map(q => {
      const shuffled = shuffle(q.options);
      return { ...q, options: shuffled };
    });

  quizState = {
    module,
    questions,
    currentIndex: 0,
    score: 0,
    answered: false,
    firstTry: true,
    wrongAttempts: 0
  };

  showView(viewQuiz);

/* ========== MEMORY GAME ========== */
let memoryState = null;

function startMemoryGame() {
  stopConfetti();
  quizTitle.textContent = '🧠 记忆配对';
  if (replayBtn) replayBtn.style.display = 'none';
  currentSpeakText = '';
  progressFill.style.width = '0%';
  memoryState = null;

  const pairs = ['🍎','🍊','🍇','🍓','🍌','🍉'];
  const cards = shuffle([...pairs, ...pairs]).map((emoji, idx) => ({
    id: idx,
    emoji,
    flipped: false,
    matched: false
  }));

  memoryState = {
    cards,
    flipped: [],
    locked: false,
    matchedPairs: 0,
    totalPairs: pairs.length,
    attempts: 0
  };

  quizState = null;
  showView(viewQuiz);
  renderMemoryGrid();
}

function renderMemoryGrid() {
  if (!memoryState) return;
  const infoHTML = '<div class="memory-info">翻开两张相同的卡片就配对成功！</div>';
  let gridHTML = '<div class="memory-grid">';
  memoryState.cards.forEach(card => {
    const classes = ['memory-card'];
    if (card.flipped) classes.push('flipped');
    if (card.matched) classes.push('matched');
    gridHTML +=
      '<button class="' + classes.join(' ') + '" data-memory-id="' + card.id + '">' +
        '<span class="card-back">?</span>' +
        '<span class="card-face">' + card.emoji + '</span>' +
      '</button>';
  });
  gridHTML += '</div>';
  questionArea.innerHTML = infoHTML + gridHTML;
  optionsGrid.innerHTML = '';
}

function handleMemoryCardClick(cardEl) {
  if (!memoryState || memoryState.locked) return;
  const id = parseInt(cardEl.dataset.memoryId);
  const card = memoryState.cards.find(c => c.id === id);
  if (!card || card.flipped || card.matched) return;

  card.flipped = true;
  memoryState.flipped.push(card);
  const nm = EMOJI_NAMES[card.emoji];
  if (nm) speak(nm);
  renderMemoryGrid();

  if (memoryState.flipped.length === 2) {
    memoryState.attempts++;
    const [c1, c2] = memoryState.flipped;
    if (c1.emoji === c2.emoji) {
      c1.matched = true;
      c2.matched = true;
      memoryState.matchedPairs++;
      memoryState.flipped = [];
      playCorrectSound();
      if (memoryState.matchedPairs >= memoryState.totalPairs) {
        setTimeout(finishMemoryGame, 600);
      } else {
        renderMemoryGrid();
      }
    } else {
      memoryState.locked = true;
      setTimeout(() => {
        c1.flipped = false;
        c2.flipped = false;
        memoryState.flipped = [];
        memoryState.locked = false;
        renderMemoryGrid();
      }, 1000);
    }
  }
}

function finishMemoryGame() {
  const total = memoryState.totalPairs;
  /* 完成记忆游戏直接奖励 3 颗星 */
  const reward = 3;
  appData.stars += reward;
  saveData(appData);
  refreshHeader();
  spawnConfetti();
  flyStarToCounter();
  checkStarAchievement();
  quizState = {
    module: 'memory',
    questions: new Array(total).fill(null),
    currentIndex: 0,
    score: total,
    answered: false,
    firstTry: true,
    wrongAttempts: 0
  };
  memoryState = null;
  showResults();
}

function renderQuestion() {
  const q = quizState.questions[quizState.currentIndex];
  const total = quizState.questions.length;
  const idx = quizState.currentIndex;

  progressFill.style.width = ((idx / total) * 100) + '%';
  quizState.answered = false;
  quizState.firstTry = true;
  quizState.wrongAttempts = 0;

  let qHTML = '';
  const module = quizState.module;

  if (module === 'characters') {
    qHTML = '<div class="question-emoji">' + q.emoji + '</div>' +
            '<div class="question-label">这个是什么？选一选</div>';
  } else if (module === 'pinyin') {
    qHTML = '<div class="question-text">' + q.pinyin + '</div>' +
            '<div class="question-label">点击正确的汉字</div>';
  } else if (module === 'counting') {
    if (q.type === 'compare') {
      const leftEmojis = Array(q.left.count).fill(q.left.emoji).join(' ');
      const rightEmojis = Array(q.right.count).fill(q.right.emoji).join(' ');
      qHTML =
        '<div style="display:flex; justify-content:center; align-items:center; gap:24px; flex-wrap:wrap;">' +
          '<div style="text-align:center;">' +
            '<div style="font-size:36px; line-height:1.6; max-width:180px; word-break:break-all;">' + leftEmojis + '</div>' +
            '<div style="font-size:18px; color:#888; margin-top:4px;">左边</div>' +
          '</div>' +
          '<div style="font-size:40px; font-weight:bold; color:#FF6B6B;">VS</div>' +
          '<div style="text-align:center;">' +
            '<div style="font-size:36px; line-height:1.6; max-width:180px; word-break:break-all;">' + rightEmojis + '</div>' +
            '<div style="font-size:18px; color:#888; margin-top:4px;">右边</div>' +
          '</div>' +
        '</div>' +
        '<div class="question-label">' + q.question + '</div>';
    } else {
      const emojis = Array(q.count).fill(q.emoji).join(' ');
      qHTML = '<div class="question-emoji" style="font-size:48px; word-break:break-all; line-height:1.8;">' + emojis + '</div>' +
              '<div class="question-label">一共有几个？数一数</div>';
    }
  } else if (module === 'math') {
    qHTML = '<div class="question-text" style="font-size:40px;">' + q.question + '</div>' +
            '<div class="question-label">算一算，选答案</div>';
  } else if (module === 'pattern') {
    const seqHTML = q.sequence.map(item =>
      '<span style="display:inline-block; margin:0 6px;">' + item + '</span>'
    ).join('') +
    '<span style="display:inline-block; margin:0 6px; color:var(--coral); font-weight:bold;">?</span>';
    qHTML = '<div class="question-emoji" style="font-size:42px;">' + seqHTML + '</div>' +
            '<div class="question-label">下一个是什么？</div>';
  } else if (module === 'classify') {
    const itemsHTML = q.items.map(item =>
      '<span style="display:inline-block; margin:0 8px;">' + item + '</span>'
    ).join('');
    qHTML = '<div class="question-emoji" style="font-size:46px;">' + itemsHTML + '</div>' +
            '<div class="question-label">哪个不是「' + q.mainCategory + '」？</div>';
  } else if (module === 'english') {
    // 听音选图：题目不显示英文单词，只给喇叭图标 + 提示，逼孩子靠"听"选
    qHTML = '<div class="question-emoji" style="font-size:64px;">🔊</div>' +
            '<div class="question-label">听一听，选一选</div>';
  } else if (module === 'clock') {
    qHTML = drawClockSVG(q.hour, q.minute) +
            '<div class="question-label">这是几点？选一选</div>';
  }

  questionArea.innerHTML = qHTML;

  let optHTML = '';
  q.options.forEach((opt, i) => {
    optHTML += '<button class="option-btn" data-index="' + i + '">' + opt + '</button>';
  });
  optionsGrid.innerHTML = optHTML;

  let speakText = '';
  currentPinyin = (module === 'pinyin') ? q.pinyin : '';
  currentEnglish = (module === 'english') ? q.word : '';
  currentClock = (module === 'clock') ? { hour: q.hour, minute: q.minute } : null;
  if (module === 'characters') speakText = '这是什么？点下面的字';
  else if (module === 'pinyin') {
    // 拼音题：用预生成的标准女声音频读音节，不再用浏览器朗读（读不准）
    if (!playPinyinAudio(q.pinyin)) speakText = '请选出读音';
  }
  else if (module === 'english') {
    // 英语题：优先播放预生成的标准英文单词音频，缺失才回退浏览器朗读
    if (!playEnglishAudio(q.word)) speakEnglish(q.word);
  }
  else if (module === 'clock') {
    // 钟表题：用浏览器中文语音报时（中文数字浏览器读得准）
    speakText = timeToChinese(q.hour, q.minute);
  }
  else if (module === 'counting') speakText = (q.type === 'compare') ? q.question : '数一数，一共有几个？';
  else if (module === 'math') speakText = '算一算，' + q.question.replace(/=/g, '等于').replace(/\+/g, '加').replace(/-/g, '减').replace(/\?/g, '');
  else if (module === 'pattern') speakText = '接下来应该是什么？';
  else if (module === 'classify') speakText = '哪个不是' + q.mainCategory + '？';
  currentSpeakText = speakText;
  if (replayBtn) replayBtn.style.display = '';
  speak(speakText);
}

function handleAnswer(btn) {
  if (!quizState || quizState.answered) return;
  const chosenIdx = parseInt(btn.dataset.index);
  const q = quizState.questions[quizState.currentIndex];
  const chosen = q.options[chosenIdx];
  const isCorrect = (chosen === q.correct);

  if (isCorrect) {
    playCorrectSound();
    quizState.answered = true;
    btn.classList.add('correct');
    document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

    document.querySelectorAll('.option-btn').forEach(b => {
      if (b.dataset.index == q.options.indexOf(q.correct)) {
        b.classList.add('correct');
      }
    });

    if (quizState.firstTry) {
      quizState.score++;
      appData.stars++;
      saveData(appData);
      refreshHeader();
      spawnConfetti();
      onCorrectAnswer(btn, true);
    } else {
      onCorrectAnswer(btn, false);
    }

    setTimeout(nextQuestion, 1500);
  } else {
    playWrongSound();
    btn.classList.add('wrong');
    const correctIdx = q.options.indexOf(q.correct);
    const correctBtn = document.querySelector('.option-btn[data-index="' + correctIdx + '"]');
    const isFinal = quizState.wrongAttempts >= 2;
    onWrongAnswer(correctBtn, isFinal);
    quizState.firstTry = false;
    quizState.wrongAttempts++;
    if (quizState.wrongAttempts >= 3) {
      quizState.answered = true;
      document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
      document.querySelectorAll('.option-btn').forEach(b => {
        if (b.dataset.index == q.options.indexOf(q.correct)) {
          b.classList.add('correct');
        }
      });
      setTimeout(nextQuestion, 2000);
    } else {
      setTimeout(() => btn.classList.remove('wrong'), 600);
    }
  }
}

function nextQuestion() {
  quizState.currentIndex++;
  if (quizState.currentIndex >= quizState.questions.length) {
    showResults();
  } else {
    renderQuestion();
  }
}

function showResults() {
  const score = quizState.score;
  const total = quizState.questions.length;
  const pct = score / total;

  let emoji, message;
  if (pct >= 0.9) { emoji = '🏆'; message = '太厉害了！'; }
  else if (pct >= 0.7) { emoji = '🎉'; message = '非常棒！'; }
  else if (pct >= 0.5) { emoji = '👍'; message = '不错哦！'; }
  else { emoji = '💪'; message = '继续加油！'; }

  resultsEmoji.textContent = emoji;
  resultsScore.innerHTML = message + '<br><span style="font-size:18px;color:#888;">本轮得分 ' + score + ' / ' + total + '</span>';
  resultsStars.textContent = '共获得 ' + appData.stars + ' 颗星星 ⭐';

  if (pct >= 0.7) spawnConfetti();
  showView(viewResults);

  saveData(appData);
}

const R2 = Math.SQRT2;

// 真七巧板：标准块（最小小三角腿=1）大三角腿2 / 中三角腿√2 / 小三角腿1 / 正方形边1

const TG_PUZZLES = {

      { shape:'S', color:'#6BCB77', target:[[2.5,0],[3.5,0],[2.5,1]] },

    ]}

function tgHexToRgb(hex){
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return m ? [parseInt(m[1],16), parseInt(m[2],16), parseInt(m[3],16)] : [167,139,250];
}
function tgColorTint(hex, a){
  const c = tgHexToRgb(hex);
  return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';
}

function tgCentroid(pts){ let x=0,y=0; pts.forEach(function(p){x+=p[0];y+=p[1];}); return [x/pts.length,y/pts.length]; }
function tgRot(p,deg){ const r=deg*Math.PI/180,c=Math.cos(r),s=Math.sin(r); return [p[0]*c-p[1]*s, p[0]*s+p[1]*c]; }
function tgToPx(p){ return [p[0]*tgScale+tgOX, p[1]*tgScale+tgOY]; }
function tgFromPx(x,y){ return [(x-tgOX)/tgScale, (y-tgOY)/tgScale]; }
function tgPtsMatch(a,b,eps){
  if(a.length!==b.length) return false;
  return a.every(function(pa){ return b.some(function(pb){ return Math.hypot(pa[0]-pb[0],pa[1]-pb[1])<eps; }); })
      && b.every(function(pb){ return a.some(function(pa){ return Math.hypot(pa[0]-pb[0],pa[1]-pb[1])<eps; }); });
}

function startTangram(level, variantIndex){
  tgLevel = (level==null)?0:level;
  const list = TG_PUZZLES[tgLevel];
  // 缺省或越界 → 随机选一套（每次进入/换一换都变化）
  if (variantIndex==null || variantIndex<0 || variantIndex>=list.length){
    variantIndex = Math.floor(Math.random()*list.length);
  }
  tgVariant = variantIndex;
  const pz = list[variantIndex];
  let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
  pz.pieces.forEach(function(pc){ pc.target.forEach(function(p){
    if(p[0]<minx)minx=p[0]; if(p[1]<miny)miny=p[1]; if(p[0]>maxx)maxx=p[0]; if(p[1]>maxy)maxy=p[1];
  });});
  const SCALE=58;
  const tw=(maxx-minx)*SCALE, th=(maxy-miny)*SCALE;
  tgScale=SCALE; tgOX=(400-tw)/2-minx*SCALE; tgOY=20-miny*SCALE;
  tgTargets = pz.pieces.map(function(pc){ return { shape:pc.shape, color:pc.color, pts:pc.target.map(function(q){return [q[0],q[1]];}), filled:false }; });
  // 托盘紧贴目标下方。积木不随机旋转，与虚线轮廓方向一致；按块数排成 1~2 行，避免重叠
  const trayTop = (maxy*SCALE + tgOY + 36) / tgScale; // 单位坐标，离目标底约 0.6 单位
  // 积木局部包围盒宽 2 单位（以大三角为准），sx 在合适范围内完整显示
  const sxMin = 0.5, sxMax = 4.2;
  const N = pz.pieces.length;
  const cols = N <= 2 ? N : 3;
  const rows = Math.ceil(N / cols);
  const cellW = cols === 1 ? 0 : (sxMax - sxMin) / (cols - 1);
  const cellH = 1.6;
  tgPieces = pz.pieces.map(function(pc,i){
    const tc = tgCentroid(pc.target);
    // 不做随机旋转 —— 让积木一开始就和虚线轮廓方向一致，孩子拖过去就能对齐
    const local = pc.target.map(function(p){ return [p[0]-tc[0], p[1]-tc[1]]; });
    const col = i % cols;
    const row = Math.floor(i / cols);
    const sx = sxMin + col * cellW;
    const sy = trayTop + row * cellH;
    const cur = local.map(function(p){ return [p[0]+sx, p[1]+sy]; });
    return { id:i, shape:pc.shape, color:pc.color, cur:cur, placed:false };
  });
  tangramNext.classList.add('hidden');
  tangramTip.textContent='🎲 '+pz.name+' - 把彩色积木拖到同色的虚线轮廓上，点一下可旋转';
  tangramDiff.querySelectorAll('.tangram-diff-btn[data-level]').forEach(function(b){ b.classList.toggle('active', parseInt(b.dataset.level)===tgLevel); });
  renderTangram();
  showView(viewTangram);
}

function renderTangram(){
  let svg='<svg class="tangram-svg" viewBox="0 0 400 520" xmlns="http://www.w3.org/2000/svg">';
  tgTargets.forEach(function(t){
    const pts=t.pts.map(function(q){const px=tgToPx(q);return px[0].toFixed(1)+','+px[1].toFixed(1);}).join(' ');
    const fill = tgColorTint(t.color||'#A78BFA', 0.13);
    const stroke = tgColorTint(t.color||'#A78BFA', 0.85);
    svg+='<polygon class="tangram-target" points="'+pts+'" style="fill:'+fill+';stroke:'+stroke+'"></polygon>';
  });
  tgPieces.forEach(function(p){
    const pts=p.cur.map(function(q){const px=tgToPx(q);return px[0].toFixed(1)+','+px[1].toFixed(1);}).join(' ');
    svg+='<polygon id="tgp-'+p.id+'" class="tangram-piece'+(p.placed?' placed':'')+'" data-id="'+p.id+'" points="'+pts+'" fill="'+p.color+'"></polygon>';
  });
  svg+='</svg>';
  tangramBoard.innerHTML=svg;
}

function tgSvgPoint(evt){
  const svg=tangramBoard.querySelector('svg');
  const pt=svg.createSVGPoint(); pt.x=evt.clientX; pt.y=evt.clientY;
  const m=pt.matrixTransform(svg.getScreenCTM().inverse());
  return tgFromPx(m.x,m.y);
}

function tgCheckWin(){
  if(tgPieces.length && tgPieces.every(function(p){return p.placed;})){
    showMedal(); spawnEmojiParticles(); spawnConfetti();
    appData.stars+=1; refreshHeader(); saveData(appData);
    tangramTip.textContent='拼好啦！真厉害 🎉 获得 1 颗星 ⭐';
    tangramNext.classList.remove('hidden');
  }
}

tangramBoard.addEventListener('pointerdown',function(e){
  const poly=e.target.closest('.tangram-piece'); if(!poly) return;
  const id=parseInt(poly.dataset.id); const p=tgPieces[id]; if(!p||p.placed) return;
  const sp=tgSvgPoint(e);
  tgDrag={ id:id, sx:sp[0], sy:sp[1], moved:false, startCur:p.cur.map(function(q){return [q[0],q[1]];}) };
});
tangramBoard.addEventListener('pointermove',function(e){
  if(!tgDrag) return;
  const sp=tgSvgPoint(e); const p=tgPieces[tgDrag.id];
  const dx=sp[0]-tgDrag.sx, dy=sp[1]-tgDrag.sy;
  if(Math.abs(dx)>0.15||Math.abs(dy)>0.15) tgDrag.moved=true;
  p.cur=tgDrag.startCur.map(function(q){return [q[0]+dx,q[1]+dy];});
  const poly=document.getElementById('tgp-'+p.id);
  if(poly) poly.setAttribute('points', p.cur.map(function(q){const px=tgToPx(q);return px[0].toFixed(1)+','+px[1].toFixed(1);}).join(' '));
});
tangramBoard.addEventListener('pointerup',function(e){
  if(!tgDrag) return;
  const p=tgPieces[tgDrag.id];
  if(!tgDrag.moved){
    const c=tgCentroid(p.cur);
    p.cur=p.cur.map(function(q){return tgRot([q[0]-c[0],q[1]-c[1]],45);}).map(function(q){return [q[0]+c[0],q[1]+c[1]];}), p.placed=false;
  }
  let snapped=false;
  if(!p.placed){
    for(let j=0;j<tgTargets.length;j++){
      const t=tgTargets[j];
      if(t.filled||t.shape!==p.shape) continue;
      if(tgPtsMatch(p.cur,t.pts,0.5)){ p.cur=t.pts.map(function(q){return [q[0],q[1]];}), p.placed=true, t.filled=true, snapped=true; break; }
    }
  }
  renderTangram();
  if(snapped) tgCheckWin();
  tgDrag=null;
});

function startMaze(size) {
  mazeSize = size || 7;
  generateMaze(mazeSize);
  mazePlayer = { r:0, c:0 };
  mazeGoal = { r: mazeSize - 1, c: mazeSize - 1 };
  mazeNext.classList.add('hidden');

  mazeDiff.querySelectorAll('.maze-diff-btn').forEach(function(b){
    b.classList.toggle('active', parseInt(b.dataset.size) === mazeSize);
  });
  renderMaze();
  showView(viewMaze);
}

function generateMaze(size) {
  mazeGrid = [];
  for (let r = 0; r < size; r++) {
    mazeGrid[r] = [];
    for (let c = 0; c < size; c++) {
      mazeGrid[r][c] = { top:true, right:true, bottom:true, left:true, visited:false };
    }
  }
  const stack = [[0, 0]];
  mazeGrid[0][0].visited = true;
  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  while (stack.length) {
    const cur = stack[stack.length - 1];
    const r = cur[0], c = cur[1];
    const nb = [];
    for (let i = 0; i < dirs.length; i++) {
      const nr = r + dirs[i][0], nc = c + dirs[i][1];
      if (nr >= 0 && nr < size && nc >= 0 && nc < size && !mazeGrid[nr][nc].visited) {
        nb.push([nr, nc, dirs[i][0], dirs[i][1]]);
      }
    }
    if (!nb.length) { stack.pop(); continue; }
    const pick = nb[Math.floor(Math.random() * nb.length)];
    const nr = pick[0], nc = pick[1], dr = pick[2], dc = pick[3];
    if (dr === -1) { mazeGrid[r][c].top = false; mazeGrid[nr][nc].bottom = false; }
    else if (dr === 1) { mazeGrid[r][c].bottom = false; mazeGrid[nr][nc].top = false; }
    else if (dc === -1) { mazeGrid[r][c].left = false; mazeGrid[nr][nc].right = false; }
    else if (dc === 1) { mazeGrid[r][c].right = false; mazeGrid[nr][nc].left = false; }
    mazeGrid[nr][nc].visited = true;
    stack.push([nr, nc]);
  }
}

function renderMaze() {
  const size = mazeSize;
  const cell = 40, pad = 4;
  const W = size * cell + pad * 2;
  let svg = '<svg class="maze-svg" viewBox="0 0 ' + W + ' ' + W + '" xmlns="http://www.w3.org/2000/svg">';
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      svg += '<rect class="maze-floor" x="' + (pad + c*cell) + '" y="' + (pad + r*cell) + '" width="' + cell + '" height="' + cell + '"/>';
    }
  }
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const g = mazeGrid[r][c];
      const x = pad + c * cell, y = pad + r * cell;
      if (g.top)    svg += '<line class="maze-wall" x1="' + x + '" y1="' + y + '" x2="' + (x+cell) + '" y2="' + y + '"/>';
      if (g.left)   svg += '<line class="maze-wall" x1="' + x + '" y1="' + y + '" x2="' + x + '" y2="' + (y+cell) + '"/>';
      if (g.right)  svg += '<line class="maze-wall" x1="' + (x+cell) + '" y1="' + y + '" x2="' + (x+cell) + '" y2="' + (y+cell) + '"/>';
      if (g.bottom) svg += '<line class="maze-wall" x1="' + x + '" y1="' + (y+cell) + '" x2="' + (x+cell) + '" y2="' + (y+cell) + '"/>';
    }
  }
  const gx = pad + mazeGoal.c * cell, gy = pad + mazeGoal.r * cell;
  svg += '<rect class="maze-goal" x="' + (gx + cell*0.3) + '" y="' + (gy + cell*0.3) + '" width="' + (cell*0.4) + '" height="' + (cell*0.4) + '" rx="4"/>';
  const px = pad + mazePlayer.c * cell + cell/2, py = pad + mazePlayer.r * cell + cell/2;
  svg += '<circle class="maze-player" cx="' + px + '" cy="' + py + '" r="' + (cell*0.28) + '"/>';
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      svg += '<rect class="maze-cell-hit" data-r="' + r + '" data-c="' + c + '" x="' + (pad + c*cell) + '" y="' + (pad + r*cell) + '" width="' + cell + '" height="' + cell + '"/>';
    }
  }
  svg += '</svg>';
  mazeBoard.innerHTML = svg;
}

function moveMazeTo(r, c) {
  const dr = Math.abs(r - mazePlayer.r), dc = Math.abs(c - mazePlayer.c);
  if (dr + dc !== 1) return;
  const g = mazeGrid[mazePlayer.r][mazePlayer.c];
  if (r === mazePlayer.r - 1 && g.top) return;
  if (r === mazePlayer.r + 1 && g.bottom) return;
  if (c === mazePlayer.c - 1 && g.left) return;
  if (c === mazePlayer.c + 1 && g.right) return;
  mazePlayer = { r, c };
  renderMaze();
  if (r === mazeGoal.r && c === mazeGoal.c) mazeWin();
}

  showMedal();
  spawnEmojiParticles();

function renderBookShelf() {
  booksShelf.innerHTML = '';

  // 第一级：大类选择（常见单词 / 常见语句）
  if (!bookCategory) {
    const cats = [
      { key:'words', emoji:'🔤', title:'常见单词', desc:'动物 · 果蔬 · 颜色 · 数字…' },
      { key:'sentences', emoji:'💬', title:'常见语句', desc:'日常生活 · 口语句子' }
    ];
    cats.forEach(function(c) {
      const card = document.createElement('div');
      card.className = 'book-card book-cat';
      card.dataset.cat = c.key;
      card.innerHTML =
        '<div class="book-emoji">' + c.emoji + '</div>' +
        '<div class="book-title">' + c.title + '</div>' +
        '<div class="book-count">' + c.desc + '</div>';
      booksShelf.appendChild(card);
    });
    return;
  }

  // 第二级：返回分类 + 该大类下的书列表
  const backRow = document.createElement('div');
  backRow.className = 'book-cat-back';
  backRow.dataset.catBack = '1';
  backRow.textContent = '← 返回分类';
  booksShelf.appendChild(backRow);

  const list = BOOK_SHELF.filter(function(b) {
    return bookCategory === 'sentences' ? b.type === 'sentences' : b.type !== 'sentences';
  });
  list.forEach(function(book) {
    const done = appData.booksFinished[book.id];
    const count = book.type === 'sentences' ? (book.pages.length + ' 句') : (book.words.length + ' 个词');
    const card = document.createElement('div');
    card.className = 'book-card';
    card.dataset.book = book.id;
    card.innerHTML =
      (done ? '<div class="book-done">✅</div>' : '') +
      '<div class="book-emoji">' + book.emoji + '</div>' +
      '<div class="book-title">' + book.title + '</div>' +
      '<div class="book-count">' + count + '</div>';
    booksShelf.appendChild(card);
  });
}

function openBook(bookId) {
  const book = BOOK_SHELF.find(function(b){ return b.id === bookId; });
  if (!book) return;
  currentBook = book;
  bookPageIndex = 0;
  readerTitle.textContent = '📖 ' + book.title;
  showView(viewReader);
  renderReaderPage();
}

function renderReaderPage() {
  if (!currentBook) return;
  const isSentence = currentBook.type === 'sentences';
  const total = isSentence ? currentBook.pages.length : currentBook.words.length;
  if (bookPageIndex >= total) { renderReaderFinish(); return; }
  let emoji, contentHtml, audioAttr, autoPlay;
  if (isSentence) {
    const pg = currentBook.pages[bookPageIndex];
    emoji = pg.emoji;
    contentHtml =
      '<div class="reader-sentence">' + pg.text + '</div>' +
      '<div class="reader-cn">' + pg.cn + '</div>';
    audioAttr = 'data-audio="' + currentBook.audioDir + '/' + pg.audio + '"';
    autoPlay = function(){ playBookAudio(currentBook.audioDir + '/' + pg.audio); };
  } else {
    const word = currentBook.words[bookPageIndex];
    emoji = wordEmoji[word] || '🔤';
    contentHtml = '<div class="reader-word">' + word + '</div>';
    audioAttr = 'data-word="' + word + '"';
    autoPlay = function(){ playEnglishAudio(word); };
  }
  readerPage.innerHTML =
    '<div class="reader-emoji">' + emoji + '</div>' +
    contentHtml +
    '<button class="reader-listen" ' + audioAttr + '>🔊 听一听</button>' +
    '<div class="reader-counter">' + (bookPageIndex + 1) + ' / ' + total + '</div>';
  readerProgress.style.width = Math.round(bookPageIndex / total * 100) + '%';
  readerPrev.disabled = (bookPageIndex === 0);
  readerNext.disabled = false;
  readerNext.textContent = (bookPageIndex === total - 1) ? '读完啦 🎉' : '下一页 →';
  // 翻到新页自动播放（在点击手势链内，允许自动播放）
  if (appData.soundEnabled) autoPlay();
}

function renderReaderFinish() {
  const book = currentBook;
  const firstTime = !appData.booksFinished[book.id];
  if (firstTime) {
    appData.booksFinished[book.id] = true;
    appData.stars += 1;
    saveData(appData);
    refreshHeader();
  }
  readerProgress.style.width = '100%';
  readerPage.innerHTML =
    '<div class="reader-finish">' +
      '<div class="finish-emoji">🌟</div>' +
      '<div class="finish-text">' + (firstTime ? '读完啦！获得一颗星 ⭐' : '又读完一遍，真棒！') + '</div>' +
      '<button class="reader-btn" id="readerFinishBtn">返回书架</button>' +
    '</div>';
  readerPrev.disabled = false;
  readerNext.disabled = true;
}

function readerGo(delta) {
  if (!currentBook) return;
  const total = currentBook.type === 'sentences' ? currentBook.pages.length : currentBook.words.length;
  if (delta > 0) {
    if (bookPageIndex >= total) return;            // 已在完成页
    if (bookPageIndex === total - 1) { bookPageIndex = total; renderReaderPage(); return; }
    bookPageIndex++;
  } else {
    if (bookPageIndex === 0) return;
    bookPageIndex--;
  }
  renderReaderPage();
}

booksShelf.addEventListener('click', function(e) {
  const cat = e.target.closest('.book-cat');
  if (cat) { bookCategory = cat.dataset.cat; renderBookShelf(); return; }
  const back = e.target.closest('.book-cat-back');
  if (back) { bookCategory = null; renderBookShelf(); return; }
  const card = e.target.closest('.book-card');
  if (!card) return;
  openBook(card.dataset.book);
});
booksBack.addEventListener('click', function() { showView(viewHome); });
gamesBack.addEventListener('click', function() { showView(viewHome); });
mazeBack.addEventListener('click', function() { showView(viewGames); });
gamesShelf.addEventListener('click', function(e) {
  const card = e.target.closest('.book-card');
  if (!card) return;
  if (card.dataset.game === 'maze') startMaze(7);
  else if (card.dataset.game === 'tangram') startTangram(0);
});
mazeDiff.addEventListener('click', function(e) {
  const btn = e.target.closest('.maze-diff-btn');
  if (!btn) return;
  startMaze(parseInt(btn.dataset.size));
});
mazeBoard.addEventListener('click', function(e) {
  const hit = e.target.closest('.maze-cell-hit');
  if (!hit) return;
  moveMazeTo(parseInt(hit.dataset.r), parseInt(hit.dataset.c));
});
mazeNext.addEventListener('click', function() { startMaze(mazeSize); });
readerBack.addEventListener('click', function() { currentBook = null; showView(viewBooks); });
readerPrev.addEventListener('click', function() { readerGo(-1); });
readerNext.addEventListener('click', function() { readerGo(1); });
readerReplay.addEventListener('click', function() {
  if (!currentBook) return;
  if (currentBook.type === 'sentences') {
    const pg = currentBook.pages[bookPageIndex];
    if (pg) playBookAudio(currentBook.audioDir + '/' + pg.audio);
  } else if (bookPageIndex < currentBook.words.length) {
    playEnglishAudio(currentBook.words[bookPageIndex]);
  }
});
readerPage.addEventListener('click', function(e) {
  const listen = e.target.closest('.reader-listen');
  if (listen) {
    if (listen.dataset.audio) playBookAudio(listen.dataset.audio);
    else if (listen.dataset.word) playEnglishAudio(listen.dataset.word);
    return;
  }
  const fin = e.target.closest('#readerFinishBtn');
  if (fin) { currentBook = null; showView(viewBooks); }
});

/* ========== INIT ========== */

if (!ttsSupported && replayBtn) replayBtn.style.display = 'none';
if (!ttsSupported) { const t = document.getElementById('ttsTip'); if (t) t.hidden = false; }
refreshHeader();
initFeedbackSystem();
showView(viewHome);

})();
</script>
</body>
</html>
